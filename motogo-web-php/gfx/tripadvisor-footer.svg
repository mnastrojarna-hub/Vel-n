<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" width="180" height="150" role="img" aria-label="Tripadvisor">
  <rect width="180" height="150" rx="8" fill="#ffffff"/>
  <!-- Owl mark -->
  <g>
    <!-- left eye -->
    <circle cx="64" cy="58" r="27" fill="#000000"/>
    <circle cx="64" cy="58" r="17" fill="#ffffff"/>
    <circle cx="64" cy="58" r="8" fill="#000000"/>
    <!-- right eye -->
    <circle cx="116" cy="58" r="27" fill="#34e0a1"/>
    <circle cx="116" cy="58" r="17" fill="#ffffff"/>
    <circle cx="116" cy="58" r="8" fill="#000000"/>
    <!-- beak -->
    <path d="M82 72 L98 72 L90 88 Z" fill="#000000"/>
  </g>
  <!-- Wordmark -->
  <text x="90" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#000000">Tripadvisor</text>
</svg>
