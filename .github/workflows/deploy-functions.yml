name: Deploy Supabase Edge Functions

# Auto-deploy edge funkcí po merge do main — obdoba toho, co dělá Vercel pro Velín.
# Bez tohohle se edge funkce (generate-invoice, process-payment, send-booking-email, …)
# musely nasazovat ručně přes `supabase functions deploy`, takže změny v main nebyly
# na Supabase živé. Vyžaduje repo secret SUPABASE_ACCESS_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Repo secret se u tebe jmenuje `access_token` (GitHub názvy secretů jsou
      # case-insensitive, takže ACCESS_TOKEN ho najde). CLI čte env SUPABASE_ACCESS_TOKEN.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      PROJECT_REF: vnwnqteskbykeucanlhk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy managed edge functions
        # Scope: NASAZUJEME JEN funkce spravované z tohoto repa. Blanket `deploy`
        # (všechny) by mohl přepsat funkce editované přímo v Supabase dashboardu.
        # Seznam rozšíříme, až ověříme, že git == Supabase (snapshot workflow níže).
        run: |
          set -e
          for fn in generate-invoice process-payment send-booking-email; do
            echo "↑ deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
