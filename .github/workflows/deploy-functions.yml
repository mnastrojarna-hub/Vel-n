name: Deploy Supabase Edge Functions

# Auto-deploy edge funkcí po merge do main — obdoba toho, co dělá Vercel pro Velín.
# Bez tohohle se edge funkce (generate-invoice, process-payment, send-booking-email, …)
# musely nasazovat ručně přes `supabase functions deploy`, takže změny v main nebyly
# na Supabase živé. Vyžaduje repo secret SUPABASE_ACCESS_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Repo secret se u tebe jmenuje `access_token` (GitHub názvy secretů jsou
      # case-insensitive, takže ACCESS_TOKEN ho najde). CLI čte env SUPABASE_ACCESS_TOKEN.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      PROJECT_REF: vnwnqteskbykeucanlhk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions (verify_jwt dle config.toml)
        # Nasazuje VŠECHNY funkce z repa — každá dostane verify_jwt podle
        # config.toml (žádný fallback na default true → konec JWT regresí).
        # Funkce jen v dashboardu (cron-*, export-data, …) nejsou v repu → netknou se.
        # Pokračuje i když jedna funkce selže (nezablokuje ostatní).
        run: |
          set +e
          rc=0
          for d in supabase/functions/*/; do
            fn=$(basename "$d")
            [ -f "${d}index.ts" ] || continue
            echo "↑ deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" || { echo "::warning::deploy $fn selhal"; rc=1; }
          done
          exit $rc
