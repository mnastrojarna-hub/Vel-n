name: Snapshot Supabase to git

# DENNI (03:15 UTC) + rucni workflow: stahne KOMPLETNI zivy stav Supabase do vetve
# `supabase-live-snapshot` pro diff vuci `main`. NIC v main neprepisuje.
# (Do 2026-09-10 bezel JEN rucne -> snapshot se sam neaktualizoval; ted denne.
#  Seznam edge funkci se bere zive z projektu (`supabase functions list`), s fallbackem
#  na adresare v supabase/functions/. Pri selhani se zalozi issue `backup-failed`.)
#
# Obsah snapshotu:
#   - vsechny edge funkce (supabase functions download)  -> potrebuje secret ACCESS_TOKEN
#   - cele DB schema: tabulky, sloupce, typy, sekvence, indexy, FK, funkce,
#     triggery, RLS politiky (supabase db dump)            -> potrebuje secret SUPABASE_DB_URL
#   - role/grants (--role-only)
#
# DATA se ZAMERNE nedumpuji (GDPR / zakaznicke udaje / secrets) - jen struktura.
#
# Secrets (Settings -> Secrets and variables -> Actions -> Repository secrets):
#   ACCESS_TOKEN     = Supabase personal access token (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_URL  = postgresql://postgres:<DB_HESLO>@db.vnwnqteskbykeucanlhk.supabase.co:5432/postgres
#                      (primy host je jen IPv6 bez add-onu a GitHub runnery IPv6 nemaji; stejny secret
#                       pouziva deploy-sql.yml a bezi zelene — pri zmene/rotaci hesla pouzij Supavisor
#                       SESSION string z Dashboardu -> Connect -> Session pooler (IPv4):
#                       postgresql://postgres.<ref>:<HESLO>@aws-0-<region>.pooler.supabase.com:5432/postgres)

on:
  schedule:
    - cron: "15 3 * * *"    # denne (5:15 CEST / 4:15 CET); GitHub muze spustit s zpozdenim
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write    # issue `backup-failed` pri selhani

concurrency:
  group: snapshot-supabase
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_REF: vnwnqteskbykeucanlhk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Kontrola secretu
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret ACCESS_TOKEN je prazdny/chybi. Pridej ho v Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Secret SUPABASE_DB_URL chybi -> snapshot bude BEZ DB schematu (jen funkce). Pridej ho pro 100% komplet."
          fi

      - name: Stahni vsechny edge funkce
        run: |
          set +e
          # 1) zivy seznam z projektu, 2) adresare v repu, 3) historicky pevny seznam - sjednoceno
          LIVE="$(supabase functions list --project-ref "$PROJECT_REF" -o json 2>/dev/null | jq -r '.[] | (.slug // .name) // empty' 2>/dev/null)"
          LOCAL="$(ls -d supabase/functions/*/ 2>/dev/null | xargs -n1 basename | grep -v -E '^(_shared|migrations)$')"
          FIXED="admin-auth admin-reset-password ai-copilot ai-moto-agent ai-public-agent auto-check-service-parts cms-save datova-schranka flexi-sync generate-document generate-invoice generate-report generate-tax manage-payment-methods mcp-server process-payment process-refund public-api receive-invoice save-verification-document scan-document send-booking-email send-broadcast send-cancellation-email send-email send-invoice-email send-message send-order-email send-push send-recovery-otp seo-check translate-content translate-document translate-pages-master webhook-receiver"
          FNS="$(printf '%s\n' $LIVE $LOCAL $FIXED | sort -u | tr '\n' ' ')"
          echo "Zive funkce z projektu: $(echo $LIVE | wc -w), celkem ke stazeni: $(echo $FNS | wc -w)"
          mkdir -p supabase/functions
          OK=0; SKIP=0
          for fn in $FNS; do
            echo "download $fn"
            if supabase functions download "$fn" --project-ref "$PROJECT_REF"; then OK=$((OK+1)); else echo "skip $fn"; SKIP=$((SKIP+1)); fi
          done
          echo "Stazeno: $OK, preskoceno (neexistuje v projektu): $SKIP"
          echo "| Edge funkce | stazeno $OK, preskoceno $SKIP |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OK" -lt 20 ]; then echo "::error::Stazeno jen $OK edge funkci - ACCESS_TOKEN neplatny nebo API nedostupne"; exit 1; fi

      - name: Dump celeho DB schematu (struktura, bez dat)
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          set -e
          mkdir -p supabase/_snapshot
          echo "-- public schema (tabulky/sloupce/typy/sekvence/indexy/FK/funkce/RLS)"
          supabase db dump --db-url "$SUPABASE_DB_URL" --schema public -f supabase/_snapshot/schema_public.sql
          echo "-- auth/storage/realtime/graphql schemata (pro uplnost)"
          supabase db dump --db-url "$SUPABASE_DB_URL" --schema auth,storage,realtime,graphql_public -f supabase/_snapshot/schema_system.sql || true
          echo "-- role a grants"
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f supabase/_snapshot/roles.sql || true

      - name: Dump CREATE TRIGGER vazeb (supabase db dump je vynechava)
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          set +e
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          mkdir -p supabase/_snapshot
          psql "$SUPABASE_DB_URL" -X -q -t -A -P pager=off \
            -c "SELECT pg_get_triggerdef(t.oid)||';' FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE NOT t.tgisinternal AND n.nspname='public' ORDER BY c.relname, t.tgname;" \
            > supabase/_snapshot/triggers.sql 2>/tmp/trig.err
          echo "CREATE TRIGGER vazeb: $(grep -c 'CREATE TRIGGER' supabase/_snapshot/triggers.sql 2>/dev/null || echo 0)"
          [ -s /tmp/trig.err ] && echo "::warning::psql triggers: $(cat /tmp/trig.err)" || true

      - name: Commit snapshotu do vetve
        run: |
          git config user.name "supabase-snapshot-bot"
          git config user.email "noreply@motogo24.cz"
          git checkout -B supabase-live-snapshot
          git add -A supabase/functions supabase/_snapshot
          git commit -m "snapshot: kompletni zivy stav Supabase (funkce + schema)" || echo "Zadne rozdily."
          git push -f origin supabase-live-snapshot

      - name: Jak porovnat
        run: |
          echo "Compare v GitHubu: main ... supabase-live-snapshot = uplny rozdil git vs Supabase."
          echo "| Snapshot | vetev supabase-live-snapshot aktualizovana |" >> "$GITHUB_STEP_SUMMARY"

      - name: Pri selhani zaloz issue backup-failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'backup-failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: LABEL, color: 'b60205',
                description: 'Denni zaloha / snapshot Supabase selhal' });
            } catch (e) { /* label uz existuje */ }
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: LABEL });
            const mine = open.find(i => /Snapshot Supabase/.test(i.title));
            if (mine) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: mine.number, body: `🔴 Další selhání: ${runUrl}` });
            } else {
              await github.rest.issues.create({ ...context.repo, title: '🔴 Snapshot Supabase do gitu selhal', labels: [LABEL],
                body: `@claude Denní snapshot živého stavu Supabase (větev supabase-live-snapshot) selhal: ${runUrl}\n\nZkontroluj log (secret ACCESS_TOKEN / SUPABASE_DB_URL, supabase CLI). Po zeleném běhu se issue zavře samo.` });
            }

      - name: Po uspechu zavri snapshot issues
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'backup-failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: LABEL });
            for (const i of open) {
              if (!/Snapshot Supabase/.test(i.title)) continue;
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: `✅ Vyřešeno — snapshot proběhl zeleně: ${runUrl}` });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
            }
