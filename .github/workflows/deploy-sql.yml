name: Deploy SQL migrations

# Automaticke nasazovani SQL migraci do Supabase po merge do main.
# Obdoba deploy-functions.yml, ale pro supabase/migrations/*.sql.
#
# Jak to funguje:
#   - V DB se vede evidencni tabulka public._git_migrations (filename PK).
#   - Workflow projde soubory supabase/migrations/*.sql v abecednim poradi
#     a aplikuje JEN ty, ktere jeste v evidenci nejsou. Kazdy soubor bezi
#     v jedne transakci (ON_ERROR_STOP) - pri chybe se nic zpola neaplikuje
#     a workflow spadne (dalsi soubory se nespousti).
#
# PRVNI SPUSTENI (POVINNE, jednorazove):
#   Actions -> Deploy SQL migrations -> Run workflow -> baseline = true
#   Tim se vsechny SOUCASNE soubory jen zaeviduji jako aplikovane (nic se
#   nespusti) - historicke migrace uz v DB jsou rucne. Bez baseline se
#   workflow odmitne spustit, aby se stare migrace omylem neaplikovaly znovu.
#
# Pozadovany GitHub secret (uz existuje pro daily-backup.yml):
#   SUPABASE_DB_URL = postgresql://postgres:<HESLO>@db.<ref>.supabase.co:5432/postgres

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**.sql"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Jen zaevidovat existujici soubory jako aplikovane (NIC nespoustet)"
        type: boolean
        default: false
      only:
        description: "Volitelne: aplikovat jen soubory, jejichz nazev obsahuje tento retezec"
        required: false
        default: ""
      force:
        description: "Aplikovat soubory vyhovujici 'only' i kdyz uz jsou v evidenci (napr. baseline je zaevidoval bez spusteni). Vyzaduje vyplnene 'only'."
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # zpetna vazba: pri selhani se automaticky zaklada issue `sql-deploy-failed`

concurrency:
  group: deploy-sql
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Aplikuj nove migrace
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BASELINE: ${{ inputs.baseline }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # Kompletni vystup kroku jde i do logu pro pripadne issue pri selhani
          exec > >(tee "$RUNNER_TEMP/deploy-sql.log") 2>&1
          psql_q() { psql "$DB_URL" -v ON_ERROR_STOP=1 -qtA -c "$1"; }

          # Guard: bez evidencni tabulky smi bezet jen baseline rezim -
          # jinak by se vsechny historicke (rucne aplikovane) migrace
          # spustily znovu.
          has_table=$(psql_q "select count(*) from information_schema.tables
                              where table_schema='public' and table_name='_git_migrations'")
          if [ "$has_table" = "0" ] && [ "${BASELINE:-false}" != "true" ]; then
            echo "::error::Evidencni tabulka _git_migrations neexistuje. Spust nejdriv workflow rucne s baseline=true (zaeviduje soucasne soubory bez spousteni)."
            exit 1
          fi

          psql_q "create table if not exists public._git_migrations (
                    filename   text primary key,
                    applied_at timestamptz not null default now(),
                    baseline   boolean not null default false)" >/dev/null

          # FORCE: znovu aplikuje soubory vyhovujici ONLY, i kdyz uz jsou
          # v evidenci (typicky po baseline, ktery je zaevidoval BEZ spusteni).
          # Bezpecnostni podminka: FORCE vyzaduje neprazdne ONLY, aby neslo
          # omylem preaplikovat vsech ~100 migraci najednou.
          if [ "${FORCE:-false}" = "true" ] && [ -z "${ONLY:-}" ]; then
            echo "::error::force=true vyzaduje vyplnene 'only' (filtr souboru)."
            exit 1
          fi

          applied=0; skipped=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            base=$(basename "$f")
            if [ -n "${ONLY:-}" ] && [[ "$base" != *"$ONLY"* ]]; then
              continue
            fi
            exists=$(psql_q "select count(*) from public._git_migrations where filename='$base'")
            if [ "$exists" != "0" ] && [ "${FORCE:-false}" != "true" ]; then
              skipped=$((skipped+1)); continue
            fi
            if [ "${BASELINE:-false}" = "true" ]; then
              psql_q "insert into public._git_migrations(filename, baseline) values ('$base', true)
                      on conflict (filename) do nothing" >/dev/null
              echo "BASELINE  $base"
            else
              echo "APPLYING  $base"
              psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$f"
              psql_q "insert into public._git_migrations(filename) values ('$base')
                      on conflict (filename) do update set applied_at = now(), baseline = false" >/dev/null
            fi
            applied=$((applied+1))
          done
          echo "Hotovo: zpracovano=$applied, preskoceno(uz aplikovane)=$skipped"

      # ── Zpetna vazba pro Claude ─────────────────────────────────────
      # Pri selhani se automaticky zalozi (nebo doplni) GitHub issue
      # s labelem `sql-deploy-failed`, logem chyby a pokyny k oprave.
      # CLAUDE.md prikazuje toto issue resit jako prioritu c. 1.
      - name: Pri selhani zaloz issue pro Claude
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const LABEL = 'sql-deploy-failed';
            let log = '';
            try { log = fs.readFileSync(process.env.RUNNER_TEMP + '/deploy-sql.log', 'utf8'); } catch {}
            const tail = log.split('\n').slice(-50).join('\n').slice(-6000) || '(log se nepodarilo zachytit — otevri beh nize)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failing = (log.match(/APPLYING\s+(\S+)/g) || []).pop() || 'viz log';

            try {
              await github.rest.issues.createLabel({ ...context.repo, name: LABEL, color: 'b60205',
                description: 'SQL autodeploy spadl — blokuje vsechny dalsi migrace' });
            } catch (e) { /* label uz existuje */ }

            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: LABEL });
            const detail = [
              `**Běh:** ${runUrl}`,
              `**Commit:** \`${context.sha.slice(0,7)}\` — ${context.payload.head_commit?.message?.split('\n')[0] ?? context.eventName}`,
              `**Padající soubor:** ${failing}`,
              '', '### Konec logu', '```', tail, '```',
            ].join('\n');

            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number,
                body: `🔴 Další selhání deploye:\n\n${detail}` });
              core.notice(`Selhani doplneno do issue #${open[0].number}`);
            } else {
              const body = [
                '@claude SQL autodeploy do Supabase spadl a **blokuje aplikaci všech dalších migrací**. Oprav to hned:',
                '',
                detail,
                '',
                '### Postup opravy (pro Claude)',
                '1. Chyba je v souboru u posledního `APPLYING …` v logu výše. Migrace se NEaplikovala (transakce = rollback), úprava souboru je tedy bezpečná.',
                '2. Oprav soubor na větvi `claude/…`, aktualizuj SUPABASE_BACKEND_STATE_* dle pravidel, vytvoř PR do `main` a merge.',
                '3. Merge automaticky spustí `deploy-sql.yml`, který doaplikuje celou frontu.',
                '4. Toto issue se po prvním zeleném běhu **zavře samo** — nechej ho otevřené jako signál.',
              ].join('\n');
              const { data: issue } = await github.rest.issues.create({ ...context.repo,
                title: '🔴 SQL autodeploy selhal — zablokovaná fronta migrací', labels: [LABEL], body });
              core.notice(`Zalozeno issue #${issue.number}`);
            }

      - name: Po uspechu zavri sql-deploy-failed issues
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'sql-deploy-failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: LABEL });
            for (const i of open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number,
                body: `✅ Vyřešeno — deploy proběhl zeleně: ${runUrl}` });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
            }
