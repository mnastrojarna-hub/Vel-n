name: Denni kompletni zaloha (Supabase + git)

# KAZDY DEN kompletni zaloha:
#   1. Cela databaze: role + schema + 100% DAT (public, auth, storage metadata) - pg_dump pres supabase CLI
#   2. Vsechny Storage buckety (documents, media, sos-photos, ...) - vsechny soubory
#   3. Cely git repozitar (vsechny vetve + tagy) - git bundle
#
# Vysledek se zabali do jednoho sifrovaneho archivu a ulozi jako GitHub Actions
# artifact (retence 30 dni). Az bude rozhodnuto KAM zalohovat (S3 / Backblaze /
# NAS / Google Drive...), odkomentuje se prislusny "Upload do ciloveho uloziste"
# krok dole - zbytek workflow se nemeni.
#
# PROC DVA CRONY A ZADNY "HODINOVY GUARD" (oprava 2026-09-10):
#   GitHub spousti scheduled workflows se zpozdenim (bezne 1-5 h, behy chodily v 10-11 h
#   prazskeho casu). Puvodni guard "bezi jen v 6:00 Europe/Prague" proto KAZDY beh
#   preskocil -> workflow byl zeleny, ale zaloha se NIKDY neudelala. Nyni:
#   - hlavni cron 03:30 UTC (5:30 CEST / 4:30 CET) + zalozni 13:30 UTC,
#   - kazdy beh se nejdriv podiva, jestli uz dnes (Europe/Prague) existuje artifact
#     motogo24-backup-<datum>; kdyz ano, preskoci (zaloha uz je), kdyz ne, zalohuje,
#   - rucni spusteni (workflow_dispatch) zalohuje VZDY (artifact ma navic cas),
#   - kazda zaloha se OVERI (velikost dumpu, pocet tabulek, git bundle, pocet souboru),
#   - pri selhani se automaticky zalozi GitHub issue s labelem `backup-failed`
#     (Claude ho resi prioritne, viz CLAUDE.md), po zelenem behu se zavre samo.
#
# Pozadovane GitHub secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL              = postgresql://postgres:<HESLO>@db.vnwnqteskbykeucanlhk.supabase.co:5432/postgres
#                                  (primy host je jen IPv6 bez add-onu; stejny secret pouziva deploy-sql.yml
#                                   a bezi zelene — pri zmene pouzij Supavisor session string z Dashboardu)
#   SUPABASE_SERVICE_ROLE_KEY    = service_role klic (Dashboard -> Settings -> API) - bez nej se
#                                  Storage NEzalohuje (beh skonci chybou + issue, DB + git se ulozi jako -partial)
#   BACKUP_PASSPHRASE            = libovolne silne heslo pro sifrovani archivu (GPG AES256)
#                                  POVINNE - archiv obsahuje osobni udaje zakazniku (GDPR)
#   SUPABASE_URL                 = nepovinne (vychozi https://vnwnqteskbykeucanlhk.supabase.co)

on:
  schedule:
    - cron: "30 3 * * *"    # hlavni beh (5:30 CEST / 4:30 CET)
    - cron: "30 13 * * *"   # pojistka: kdyz ranni beh GitHub nespustil nebo spadl
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read    # kontrola, jestli uz dnes existuje artifact zalohy
  issues: write    # zpetna vazba: issue `backup-failed` pri selhani

concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vnwnqteskbykeucanlhk.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Guard - uz dnes zaloha existuje?
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const stamp = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Prague' }); // YYYY-MM-DD
            const prefix = `motogo24-backup-${stamp}`;
            core.setOutput('stamp', stamp);
            if (context.eventName === 'workflow_dispatch') {
              const hm = new Date().toLocaleTimeString('sv-SE', { timeZone: 'Europe/Prague', hour12: false }).slice(0, 5).replace(':', '');
              core.setOutput('name', `${prefix}-${hm}`);
              core.setOutput('run', 'true');
              core.notice(`Rucni spusteni -> zalohuji vzdy (${prefix}-${hm})`);
              return;
            }
            const { data } = await github.rest.actions.listArtifactsForRepo({ ...context.repo, per_page: 100 });
            // castecna zaloha (-partial, bez Storage) se nepocita — pojistny beh ma zkusit plnou
            const done = (data.artifacts || []).find(a => !a.expired && a.name.startsWith(prefix) && !a.name.includes('-partial'));
            core.setOutput('name', prefix);
            if (done) {
              core.setOutput('run', 'false');
              core.notice(`Zaloha ${done.name} uz dnes existuje (${done.created_at}) - tento beh se preskakuje.`);
            } else {
              core.setOutput('run', 'true');
              core.notice(`Zaloha pro ${stamp} jeste neexistuje -> zalohuji.`);
            }

      - name: Kontrola secretu
        id: secrets
        if: steps.guard.outputs.run == 'true'
        run: |
          MISSING=""
          [ -z "$SUPABASE_DB_URL" ] && MISSING="$MISSING SUPABASE_DB_URL"
          [ -z "$BACKUP_PASSPHRASE" ] && MISSING="$MISSING BACKUP_PASSPHRASE"
          if [ -n "$MISSING" ]; then
            echo "::error::Chybi GitHub secrets:$MISSING - zaloha nemuze probehnout (bez DB URL neni co zalohovat, bez passphrase nelze archiv s osobnimi udaji sifrovat). Pridej je v Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Chybi secret SUPABASE_SERVICE_ROLE_KEY - Storage (dokumenty, fotky) se NEzalohuje. DB + git se ulozi jako castecna zaloha (-partial) a beh skonci chybou, dokud secret nepridas."
            echo "storage=false" >> "$GITHUB_OUTPUT"
          else
            echo "storage=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.run == 'true'
        with:
          version: latest

      - name: Zaloha git repozitare (vsechny vetve + tagy)
        if: steps.guard.outputs.run == 'true'
        run: |
          set -e
          mkdir -p _backup
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git bundle create _backup/git-repo.bundle --all
          git bundle verify _backup/git-repo.bundle

      - name: Zaloha databaze (role + schema + 100% dat)
        if: steps.guard.outputs.run == 'true'
        run: |
          set -e
          mkdir -p _backup/db
          echo "== role a grants =="
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f _backup/db/roles.sql
          echo "== schema public =="
          supabase db dump --db-url "$SUPABASE_DB_URL" --schema public -f _backup/db/schema_public.sql
          echo "== schema auth + storage (struktura) =="
          supabase db dump --db-url "$SUPABASE_DB_URL" --schema auth,storage -f _backup/db/schema_system.sql || true
          echo "== DATA public (vsechny tabulky) =="
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy --schema public -f _backup/db/data_public.sql
          echo "== DATA auth (uzivatele, identity) + storage (metadata objektu) =="
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy --schema auth,storage -f _backup/db/data_system.sql || true
          ls -lh _backup/db/

      - name: Zaloha Storage bucketu (vsechny soubory)
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.storage == 'true'
        run: |
          set -e
          node backup/storage-backup.mjs _backup/storage

      - name: Overeni uplnosti zalohy
        if: steps.guard.outputs.run == 'true'
        run: |
          set -e
          FAIL=0
          for f in roles.sql schema_public.sql data_public.sql; do
            if [ ! -s "_backup/db/$f" ]; then echo "::error::Dump $f chybi nebo je prazdny"; FAIL=1; fi
          done
          TABLES=$(grep -c '^CREATE TABLE' _backup/db/schema_public.sql || true)
          COPIES=$(grep -c '^COPY ' _backup/db/data_public.sql || true)
          FILES=$(find _backup/storage -type f 2>/dev/null | wc -l)
          echo "Tabulek ve schematu: $TABLES, COPY bloku dat: $COPIES, souboru ve Storage: $FILES"
          [ "$TABLES" -ge 50 ] || { echo "::error::Schema obsahuje jen $TABLES tabulek (ocekavano >= 50) - dump je neuplny"; FAIL=1; }
          [ "$COPIES" -ge 50 ] || { echo "::error::Data obsahuji jen $COPIES COPY bloku (ocekavano >= 50) - dump je neuplny"; FAIL=1; }
          if [ "${{ steps.secrets.outputs.storage }}" = "true" ]; then
            [ "$FILES" -ge 1 ] || { echo "::error::Storage zaloha neobsahuje zadny soubor"; FAIL=1; }
          else
            echo "::warning::Storage preskocen (chybi SUPABASE_SERVICE_ROLE_KEY) - castecna zaloha"
          fi
          git bundle verify _backup/git-repo.bundle >/dev/null || { echo "::error::git bundle neprosel verifikaci"; FAIL=1; }
          {
            echo "## Denni zaloha ${{ steps.guard.outputs.stamp }}"
            echo "| Cast | Vysledek |"; echo "|---|---|"
            echo "| DB schema | $TABLES tabulek, $(du -h _backup/db/schema_public.sql | cut -f1) |"
            echo "| DB data | $COPIES tabulek s daty, $(du -h _backup/db/data_public.sql | cut -f1) |"
            echo "| Storage | $FILES souboru, $(du -sh _backup/storage 2>/dev/null | cut -f1) |"
            echo "| git bundle | $(du -h _backup/git-repo.bundle | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$FAIL" = "0" ]

      - name: Zabaleni a sifrovani archivu (GPG AES256)
        if: steps.guard.outputs.run == 'true'
        run: |
          set -e
          NAME="${{ steps.guard.outputs.name }}"
          [ "${{ steps.secrets.outputs.storage }}" = "true" ] || NAME="$NAME-partial"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          tar -czf "$NAME.tar.gz" -C _backup .
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            -o "$NAME.tar.gz.gpg" "$NAME.tar.gz"
          rm "$NAME.tar.gz"
          rm -rf _backup
          ls -lh motogo24-backup-*.tar.gz.gpg
          echo "| Archiv | $NAME.tar.gz.gpg ($(du -h "$NAME.tar.gz.gpg" | cut -f1)) |" >> "$GITHUB_STEP_SUMMARY"
          # Desifrovani pri obnove:
          #   gpg --batch --passphrase '<BACKUP_PASSPHRASE>' -d motogo24-backup-<datum>.tar.gz.gpg | tar -xz

      - name: Ulozeni zalohy (GitHub Actions artifact, retence 30 dni)
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: motogo24-backup-*.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Castecna zaloha = chyba (chybi SUPABASE_SERVICE_ROLE_KEY)
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.storage != 'true'
        run: |
          echo "::error::Zaloha je jen castecna (DB + git, BEZ Storage). Pridej secret SUPABASE_SERVICE_ROLE_KEY (Supabase Dashboard -> Project Settings -> API -> service_role)."
          exit 1

      # ------------------------------------------------------------------
      # AZ BUDE ROZHODNUTO KAM ZALOHOVAT, odkomentuj JEDEN z kroku nize
      # a pridej prislusne secrets. Artifact krok nahore pak muzes nechat
      # jako sekundarni kopii, nebo smazat.
      # ------------------------------------------------------------------

      # --- Varianta A: S3-kompatibilni uloziste (AWS S3 / Backblaze B2 / Cloudflare R2 / Wasabi) ---
      # - name: Upload do ciloveho uloziste (S3)
      #   if: steps.guard.outputs.run == 'true'
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
      #   run: |
      #     aws s3 cp motogo24-backup-*.tar.gz.gpg "s3://<BUCKET>/motogo24/" \
      #       --endpoint-url "${{ secrets.BACKUP_S3_ENDPOINT }}"

      # --- Varianta B: cokoliv pres rclone (Google Drive, OneDrive, SFTP, NAS...) ---
      # - name: Upload do ciloveho uloziste (rclone)
      #   if: steps.guard.outputs.run == 'true'
      #   run: |
      #     curl https://rclone.org/install.sh | sudo bash
      #     echo "${{ secrets.BACKUP_RCLONE_CONF }}" > rclone.conf
      #     rclone --config rclone.conf copy motogo24-backup-*.tar.gz.gpg remote:motogo24-backups/
      #     rm rclone.conf

      # Pri selhani se automaticky zalozi (nebo doplni) GitHub issue s labelem
      # `backup-failed` - CLAUDE.md prikazuje toto issue resit prioritne.
      - name: Pri selhani zaloz issue backup-failed
        if: failure() && steps.guard.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'backup-failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: LABEL, color: 'b60205',
                description: 'Denni zaloha / snapshot Supabase selhal' });
            } catch (e) { /* label uz existuje */ }
            const detail = `**Workflow:** ${context.workflow}\n**Běh:** ${runUrl}\n**Datum zálohy:** ${{ toJSON(steps.guard.outputs.stamp) }}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: LABEL });
            const mine = open.find(i => /Denní záloha/.test(i.title));   // snapshot ma vlastni issue
            if (mine) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: mine.number, body: `🔴 Další selhání:\n\n${detail}` });
            } else {
              const body = [
                '@claude DENNÍ ZÁLOHA SELHALA — data z dnešního dne nejsou zálohovaná. Oprav to prioritně:',
                '', detail, '',
                '### Postup (pro Claude)',
                '1. Otevři log běhu výše a najdi padající krok (secrets, `supabase db dump`, Storage, verifikace).',
                '2. Chybějící/neplatný secret opraví uživatel v Settings → Secrets and variables → Actions (SUPABASE_DB_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, BACKUP_PASSPHRASE) — napiš mu přesně který.',
                '3. Chybu ve workflow oprav na větvi `claude/…`, PR do `main`, merge; pak spusť workflow ručně (Actions → Run workflow) a ověř zelený běh.',
                '4. Toto issue se po prvním zeleném běhu **zavře samo**.',
              ].join('\n');
              await github.rest.issues.create({ ...context.repo, title: '🔴 Denní záloha selhala — data nejsou zálohovaná', labels: [LABEL], body });
            }
            core.setFailed('DENNI ZALOHA SELHALA - zkontroluj log behu. Data z dnesniho dne nejsou zalohovana!');

      - name: Po uspechu zavri backup-failed issues
        if: success() && steps.guard.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'backup-failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: LABEL });
            for (const i of open) {
              if (!/Denní záloha/.test(i.title)) continue;
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: `✅ Vyřešeno — záloha proběhla zeleně: ${runUrl}` });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
            }
