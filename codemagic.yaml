workflows:
  generate-keystore:
    name: Generate upload keystore (one-time)
    max_build_duration: 5
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        KEYSTORE_DNAME: "CN=Jiri Semorad, O=Motogo24, OU=Motogo24, L=Mezna, ST=CZ, C=CZ"
      groups:
        - keystore_init
    scripts:
      - name: Generate upload keystore
        script: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD env var is not set."
            echo "Create env group 'keystore_init' with secure variable KEYSTORE_PASSWORD."
            exit 1
          fi
          OUT="$CM_BUILD_DIR/motogo24-upload.jks"
          keytool -genkeypair -v \
            -keystore "$OUT" \
            -keyalg RSA -keysize 2048 -validity 9125 \
            -alias upload \
            -dname "$KEYSTORE_DNAME" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD"
          echo ""
          echo "=== KEYSTORE FINGERPRINT (save this) ==="
          keytool -list -v -keystore "$OUT" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:|Alias name:|Valid from:"
          echo ""
          echo "Download motogo24-upload.jks from build artifacts."
          echo "Then upload it to Codemagic → Code signing identities → Android keystores"
          echo "with reference name 'motogo24_upload' and the same password."
    artifacts:
      - motogo24-upload.jks
    publishing:
      email:
        recipients:
          - mnastrojarna@gmail.com
        notify:
          success: true
          failure: true

  motogo-android-debug:
    name: MotoGo24 Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Accept Android licenses
        script: |
          yes | flutter doctor --android-licenses || true
      - name: Gradle init script (repa pro Kotlin plugin Flutter SDK buildu)
        script: |
          # Vnitřní build Flutter SDK (flutter_tools/gradle) resolvuje svůj
          # Kotlin plugin JEN z Gradle Plugin Portalu — repozitáře ze
          # settings.gradle appky se na included build nevztahují. Když portál
          # artefakt nevydá, padá "Plugin org.jetbrains.kotlin.jvm ... was not
          # found". Init script přidá google() + mavenCentral() VŠEM buildům.
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF
      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter
          flutter pub get
      - name: Build APK (debug)
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter
          flutter build apk --debug
      - name: Generate QR code for APK download
        script: |
          brew install qrencode
          APK_PATH=$(find $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter/build -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            BUILD_URL="https://codemagic.io/app/${CM_PROJECT_ID}/build/${CM_BUILD_ID}"
            qrencode -t UTF8 "$BUILD_URL"
            qrencode -o $CM_BUILD_DIR/qr_download.png -s 10 "$BUILD_URL"
            echo ""
            echo "========================================="
            echo "Scan QR above or open: $BUILD_URL"
            echo "========================================="
          fi
    artifacts:
      - Motogo-app-main/motogo-app-flutter/build/**/outputs/**/*.apk
      - qr_download.png
    publishing:
      email:
        recipients:
          - mnastrojarna@gmail.com
        notify:
          success: true
          failure: true

  motogo-ios-release:
    name: MotoGo24 iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # App Store Connect API klíč — vytvoř v Codemagic UI:
      # Teams → Integrations → Developer Portal → App Store Connect API key,
      # pojmenuj ho přesně "motogo24_app_store_connect" (nebo zde uprav název).
      app_store_connect: motogo24_app_store_connect
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # POZOR: NErozšiřovat o automatický `ios_signing` blok (distribution_type +
      # bundle_identifier). Ten se spouští při přípravě prostředí ještě před skripty
      # a profil jen HLEDÁ (nevytváří) → míchání s manuálním fetch-signing-files
      # níže vyhazuje "No matching profiles found for bundle identifier ...".
      # Podepisování řešíme plně MANUÁLNĚ v krocích níže (fetch-signing-files --create
      # + use-profiles). App ID com.motogo24.rental (firemní účet Mnástrojárna s.r.o.,
      # Team ID YP7TF3APAV; dříve com.motogo24.app na individuálním účtu) musí mít
      # v Apple Developer portálu zapnuté capabilities: Push Notifications,
      # Apple Pay (merchant.cz.motogo24.rental), Associated Domains —
      # viz APPLE_RELEASE_SETUP.md. Team se NEuvádí natvrdo: bere se z API klíče
      # integrace app_store_connect (motogo24_app_store_connect v Codemagic UI).
      groups:
        # Env group "firebase_ios" se secure proměnnou GOOGLE_SERVICE_INFO_PLIST
        # (base64 obsahu GoogleService-Info.plist z Firebase console).
        # TODO (přechod na firemní účet): po registraci iOS appky s bundle ID
        # com.motogo24.rental ve Firebase konzoli nahradit hodnotu
        # GOOGLE_SERVICE_INFO_PLIST base64 NOVÉHO plistu (řeší se v Codemagic UI).
        - firebase_ios
        # Env group "ios_signing" se secure proměnnou CERTIFICATE_PRIVATE_KEY
        # (RSA privátní klíč pro distribuční certifikát — viz krok níže).
        - ios_signing
    scripts:
      - name: Write GoogleService-Info.plist (Firebase iOS config)
        script: |
          PLIST_PATH="$CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter-ios/ios/Runner/GoogleService-Info.plist"
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "ERROR: GOOGLE_SERVICE_INFO_PLIST env var is not set."
            echo "Create env group 'firebase_ios' with secure variable GOOGLE_SERVICE_INFO_PLIST"
            echo "(base64 of GoogleService-Info.plist downloaded from Firebase console,"
            echo " iOS app with bundle ID com.motogo24.rental in project motogo24-518b4)."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$PLIST_PATH"
          plutil -lint "$PLIST_PATH"
      - name: Disable Swift Package Manager (Firebase pody ho nepodporují)
        script: |
          # firebase_core / firebase_messaging / connectivity_plus /
          # flutter_secure_storage NEPODPORUJÍ Swift Package Manager. Když má
          # Flutter na build stroji SPM zapnutý, `flutter build ipa` přidá SPM
          # integraci ("Adding Swift Package Manager integration"), PŘEPÍŠE
          # Podfile a změní stavbu modulů → úpravy Podfile (CLANG_ALLOW i
          # linkage) se vůbec neprojeví a firebase_messaging padá na
          # non-modular <Firebase/Firebase.h>. Vypnutím SPM se použije čistý
          # CocoaPods flow s naším Podfile.
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter-ios
          flutter pub get
      - name: Fetch / create signing files (cert + App Store profil)
        script: |
          # Integrace app_store_connect exportuje ASC API-klíč do env (APP_STORE_CONNECT_*),
          # takže app-store-connect CLI se jím autentizuje sám.
          # CERTIFICATE_PRIVATE_KEY = TRVALÝ RSA privátní klíč (env group ios_signing),
          # kterým se distribuční certifikát vytvoří a v dalších buildech spáruje.
          # Bez něj fetch-signing-files neumí certifikát uložit
          # ("Cannot save Signing Certificates without certificate private key"),
          # protože Apple privátní klíč existujícího certifikátu nikdy nevydá.
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY není nastavená."
            echo "Vygeneruj klíč:  ssh-keygen -t rsa -b 2048 -m PEM -f cert_key -q -N ''"
            echo "a obsah souboru 'cert_key' vlož jako SECURE env var CERTIFICATE_PRIVATE_KEY"
            echo "do env group 'ios_signing' v Codemagicu."
            exit 1
          fi
          keychain initialize
          # --certificate-key: privátní klíč pro certifikát; --create vytvoří nový
          # distribuční cert (spárovaný s tímto klíčem) i App Store provisioning
          # profil pro com.motogo24.rental, pokud ještě nejsou v Apple Developer portálu.
          app-store-connect fetch-signing-files "com.motogo24.rental" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles --project="$CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter-ios/ios/Runner.xcodeproj"
      - name: Build signed IPA (App Store)
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter-ios
          # CFBundleVersion musi byt VYSSI nez cokoliv uz nahraneho v App Store
          # Connectu, jinak upload skonci "The bundle version must be higher".
          # $BUILD_NUMBER je jen citac workflow (po zalozeni/prejmenovani zacina
          # od 1), proto se bere maximum z TestFlightu a App Store + 1 a na
          # $BUILD_NUMBER se padá jen jako na zachranu, kdyz ASC nic nevrati.
          APP_ID=6806045151
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null | tr -dc '0-9')
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null | tr -dc '0-9')
          NEXT=$BUILD_NUMBER
          for N in "$TF" "$AS"; do
            if [ -n "$N" ] && [ "$((N + 1))" -gt "$NEXT" ]; then NEXT=$((N + 1)); fi
          done
          echo "TestFlight: ${TF:-?}, App Store: ${AS:-?}, BUILD_NUMBER: $BUILD_NUMBER -> pouziju $NEXT"
          # CFBundleShortVersionString = verze z pubspec.yaml (JEDINY zdroj pravdy
          # pro versionName — drivejsi hardcoded --build-name tady zpusobil, ze
          # buildy ignorovaly bump verze v pubspec a hlasily starou verzi).
          flutter build ipa --release \
            --build-number=$NEXT \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - Motogo-app-main/motogo-app-flutter-ios/build/ios/ipa/*.ipa
      - Motogo-app-main/motogo-app-flutter-ios/build/ios/archive/Runner.xcarchive/dSYMs/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload IPA do App Store Connectu proběhne tak jako tak (nezávisle na
        # submit_*). submit_to_testflight=false: nesubmitujeme do EXTERNÍHO
        # TestFlight beta review — to vyžaduje Beta App Information (feedback
        # e-mail, kontakt na review) a jinak končí build červeně. Nepotřebujeme
        # ho: appka jde rovnou do App Store review a interní TestFlight funguje
        # i bez toho. Do App Store se odesílá ručně z ASC (submit_to_app_store=false).
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - mnastrojarna@gmail.com
        notify:
          success: true
          failure: true

  motogo-android-release:
    name: MotoGo24 Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        # skupina v Codemagic se jmenuje "goole_play" (preklep pri zalozeni, ale funkcni)
        - goole_play
      android_signing:
        - motogo24_upload
    scripts:
      - name: Accept Android licenses
        script: |
          yes | flutter doctor --android-licenses || true
      - name: Gradle init script (repa pro Kotlin plugin Flutter SDK buildu)
        script: |
          # Viz motogo-android-debug — bez tohoto padá resolvování
          # org.jetbrains.kotlin.jvm pro flutter_tools/gradle included build.
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF
      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter
          flutter pub get
      - name: Zjisti dalsi versionCode z Google Play
        script: |
          # POZOR: $BUILD_NUMBER je citac JEDNOHO workflow v Codemagicu. Kdyz se
          # workflow zalozi znovu nebo prejmenuje, zacne zase od 1 — a Play pak
          # release odmitne hlaskou "Tuto verzi nelze vydat, protoze zadnym
          # existujicim uzivatelum neumoznuje upgradovat na nove pridane balicky
          # aplikaci" (= versionCode neni vyssi nez ten, ktery uzivatele uz maji).
          # Proto se versionCode bere PRIMO z Play: nejvyssi napric vsemi tracky + 1.
          if [ -n "$VERSION_CODE" ]; then
            # Rucni prepis z env skupiny (zachranna brzda, kdyz Play API nejede).
            NEXT="$VERSION_CODE"
            echo "versionCode z env VERSION_CODE: $NEXT"
          else
            LATEST=$(google-play get-latest-build-number \
              --credentials @env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS \
              --package-name "com.motogo24.app" 2>/dev/null | tr -dc '0-9')
            if [ -z "$LATEST" ]; then
              echo "CHYBA: Google Play nevratil nejvyssi versionCode."
              echo "Bez nej hrozi, ze se nahraje AAB s nizsim versionCode a Play release odmitne."
              echo "Rozhodnuti: bud oprav pristup service accountu (GCLOUD_SERVICE_ACCOUNT_CREDENTIALS,"
              echo "role Release manager), nebo docasne nastav v env skupine 'goole_play'"
              echo "promennou VERSION_CODE na (nejvyssi versionCode v Play + 1)."
              exit 1
            fi
            NEXT=$((LATEST + 1))
            echo "Nejvyssi versionCode v Play: $LATEST -> pouziju $NEXT"
          fi
          echo "VERSION_CODE=$NEXT" >> $CM_ENV
      - name: Build release APK
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter
          # versionCode = $VERSION_CODE z predchoziho kroku (Play + 1), takze je vzdy
          # vyssi nez to, co maji uzivatele. versionName = verze z pubspec.yaml
          # (JEDINY zdroj pravdy — drivejsi hardcoded --build-name tady zpusobil,
          # ze buildy ignorovaly bump verze v pubspec a hlasily starou verzi).
          flutter build apk --release --build-number=$VERSION_CODE
      - name: Build release AAB (Play Store)
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter
          # Stejny versionCode jako u APK (jeden release = jeden versionCode).
          # versionName = verze z pubspec.yaml (viz vyse).
          flutter build appbundle --release --build-number=$VERSION_CODE
      - name: Generate QR code for APK download
        script: |
          brew install qrencode
          APK_PATH=$(find $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter/build -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            BUILD_URL="https://codemagic.io/app/${CM_PROJECT_ID}/build/${CM_BUILD_ID}"
            qrencode -t UTF8 "$BUILD_URL"
            qrencode -o $CM_BUILD_DIR/qr_download.png -s 10 "$BUILD_URL"
            echo ""
            echo "========================================="
            echo "Scan QR above or open: $BUILD_URL"
            echo "========================================="
          fi
    artifacts:
      - Motogo-app-main/motogo-app-flutter/build/**/outputs/**/*.apk
      - Motogo-app-main/motogo-app-flutter/build/**/outputs/**/*.aab
      - qr_download.png
    publishing:
      google_play:
        # Publikace AAB do Google Play pres Play Developer API.
        # in_app_update_priority 5 => blokujici IMMEDIATE in-app update u uzivatelu.
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        in_app_update_priority: 5
      email:
        recipients:
          - mnastrojarna@gmail.com
        notify:
          success: true
          failure: true
