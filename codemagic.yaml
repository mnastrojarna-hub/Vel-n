workflows:
  generate-keystore:
    name: Generate upload keystore (one-time)
    max_build_duration: 5
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        KEYSTORE_DNAME: "CN=Jiri Semorad, O=Motogo24, OU=Motogo24, L=Mezna, ST=CZ, C=CZ"
      groups:
        - keystore_init
    scripts:
      - name: Generate upload keystore
        script: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD env var is not set."
            echo "Create env group 'keystore_init' with secure variable KEYSTORE_PASSWORD."
            exit 1
          fi
          OUT="$CM_BUILD_DIR/motogo24-upload.jks"
          keytool -genkeypair -v \
            -keystore "$OUT" \
            -keyalg RSA -keysize 2048 -validity 9125 \
            -alias upload \
            -dname "$KEYSTORE_DNAME" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD"
          echo ""
          echo "=== KEYSTORE FINGERPRINT (save this) ==="
          keytool -list -v -keystore "$OUT" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:|Alias name:|Valid from:"
          echo ""
          echo "Download motogo24-upload.jks from build artifacts."
          echo "Then upload it to Codemagic → Code signing identities → Android keystores"
          echo "with reference name 'motogo24_upload' and the same password."
    artifacts:
      - motogo24-upload.jks
    publishing:
      email:
        recipients:
          - mnastrojarna@gmail.com
        notify:
          success: true
          failure: true

  motogo-android-debug:
    name: MotoGo24 Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Accept Android licenses
        script: |
          yes | flutter doctor --android-licenses || true
      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter
          flutter pub get
      - name: Build APK (debug)
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter
          flutter build apk --debug
      - name: Generate QR code for APK download
        script: |
          brew install qrencode
          APK_PATH=$(find $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter/build -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            BUILD_URL="https://codemagic.io/app/${CM_PROJECT_ID}/build/${CM_BUILD_ID}"
            qrencode -t UTF8 "$BUILD_URL"
            qrencode -o $CM_BUILD_DIR/qr_download.png -s 10 "$BUILD_URL"
            echo ""
            echo "========================================="
            echo "Scan QR above or open: $BUILD_URL"
            echo "========================================="
          fi
    artifacts:
      - Motogo-app-main/motogo-app-flutter/build/**/outputs/**/*.apk
      - qr_download.png
    publishing:
      email:
        recipients:
          - mnastrojarna@gmail.com
        notify:
          success: true
          failure: true

  motogo-ios-release:
    name: MotoGo24 iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # App Store Connect API klíč — vytvoř v Codemagic UI:
      # Teams → Integrations → Developer Portal → App Store Connect API key,
      # pojmenuj ho přesně "motogo24_app_store_connect" (nebo zde uprav název).
      app_store_connect: motogo24_app_store_connect
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        # Codemagic si přes App Store Connect integraci sám stáhne/vytvoří
        # distribuční certifikát + provisioning profil pro tento bundle ID.
        # App ID com.motogo24.app musí mít v Apple Developer portálu zapnuté
        # capabilities: Push Notifications, Apple Pay (merchant.cz.motogo24),
        # Associated Domains — viz APPLE_RELEASE_SETUP.md.
        distribution_type: app_store
        bundle_identifier: com.motogo24.app
      groups:
        # Env group "firebase_ios" se secure proměnnou GOOGLE_SERVICE_INFO_PLIST
        # (base64 obsahu GoogleService-Info.plist z Firebase console).
        - firebase_ios
    scripts:
      - name: Write GoogleService-Info.plist (Firebase iOS config)
        script: |
          PLIST_PATH="$CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter-ios/ios/Runner/GoogleService-Info.plist"
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "ERROR: GOOGLE_SERVICE_INFO_PLIST env var is not set."
            echo "Create env group 'firebase_ios' with secure variable GOOGLE_SERVICE_INFO_PLIST"
            echo "(base64 of GoogleService-Info.plist downloaded from Firebase console,"
            echo " iOS app with bundle ID com.motogo24.app in project motogo24-518b4)."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$PLIST_PATH"
          plutil -lint "$PLIST_PATH"
      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter-ios
          flutter pub get
      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles --project="$CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter-ios/ios/Runner.xcodeproj"
      - name: Build signed IPA (App Store)
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter-ios
          # CFBundleVersion = Codemagic $BUILD_NUMBER (vždy unikátní a rostoucí),
          # CFBundleShortVersionString (1.1.0) zůstává z pubspec.yaml.
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - Motogo-app-main/motogo-app-flutter-ios/build/ios/ipa/*.ipa
      - Motogo-app-main/motogo-app-flutter-ios/build/ios/archive/Runner.xcarchive/dSYMs/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Nahraje build do TestFlightu; do recenze/App Store se posílá ručně
        # z App Store Connect (submit_to_app_store: false = žádné překvapení).
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - mnastrojarna@gmail.com
        notify:
          success: true
          failure: true

  motogo-android-release:
    name: MotoGo24 Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      android_signing:
        - motogo24_upload
    scripts:
      - name: Accept Android licenses
        script: |
          yes | flutter doctor --android-licenses || true
      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter
          flutter pub get
      - name: Build release APK
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter
          # versionCode = Codemagic build number ($BUILD_NUMBER), který se automaticky
          # zvyšuje s každým buildem → je vždy unikátní a rostoucí, takže Google Play už
          # nikdy neodmítne "verze byla použita". versionName (1.0.1) zůstává z pubspec.yaml.
          flutter build apk --release --build-number=$BUILD_NUMBER
      - name: Build release AAB (Play Store)
        script: |
          cd $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter
          # Stejný build number jako u APK (jeden release = jeden versionCode).
          flutter build appbundle --release --build-number=$BUILD_NUMBER
      - name: Generate QR code for APK download
        script: |
          brew install qrencode
          APK_PATH=$(find $CM_BUILD_DIR/Motogo-app-main/motogo-app-flutter/build -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            BUILD_URL="https://codemagic.io/app/${CM_PROJECT_ID}/build/${CM_BUILD_ID}"
            qrencode -t UTF8 "$BUILD_URL"
            qrencode -o $CM_BUILD_DIR/qr_download.png -s 10 "$BUILD_URL"
            echo ""
            echo "========================================="
            echo "Scan QR above or open: $BUILD_URL"
            echo "========================================="
          fi
    artifacts:
      - Motogo-app-main/motogo-app-flutter/build/**/outputs/**/*.apk
      - Motogo-app-main/motogo-app-flutter/build/**/outputs/**/*.aab
      - qr_download.png
    publishing:
      email:
        recipients:
          - mnastrojarna@gmail.com
        notify:
          success: true
          failure: true
