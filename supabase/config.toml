# Supabase project configuration
# Pozn.: `project_id` musí matchovat tvůj cloud projekt (vnwnqteskbykeucanlhk).
# Per-function settings (`verify_jwt`, `import_map`, ...) se aplikují pouze
# pokud používáš `supabase functions deploy` s tímto repo jako workspace.

project_id = "vnwnqteskbykeucanlhk"

# ===== Edge funkce s vypnutou JWT verifikací =====
# Tyhle funkce volají anonymní klienti (web, AI agenti) a auth si řeší
# samy (token v body, X-Api-Key header, IP rate-limit, ...). Bez tohoto
# nastavení Supabase gateway zablokuje i OPTIONS preflight → CORS error.

# CMS save (volá motogo24.com admin overlay; auth = cms_admin_token v body)
[functions.cms-save]
verify_jwt = false

# Stripe platební brána — volá web (dárkový poukaz, e-shop) anonymně přes apikey
# bez JWT. BEZ verify_jwt=false vrací gateway 401 ("nepodařilo se vytvořit platbu").
# (Auto-deploy CLI jinak defaultuje verify_jwt=true → regrese web plateb.)
[functions.process-payment]
verify_jwt = false

# Generuje faktury/doklady — volá Velín (admin JWT) i triggery/webhook (service key).
# verify_jwt=false ať CLI deploy nezmění dokumentovaný stav (OFF).
[functions.generate-invoice]
verify_jwt = false

# Odesílá branded maily — volají triggery/webhook (service key) i Velín. OFF.
[functions.send-booking-email]
verify_jwt = false

# SEO Health checker — server-side fetch & parse zive stranky motogo24.cz
# (browser-side fetch z velin domeny blokuje CORS). Volá ho Velin SEO Health
# dashboard. Read-only, jen GET na motogo24.cz whitelist domeny.
[functions.seo-check]
verify_jwt = false

# Veřejné REST API pro AI agenty / partnery (auth = X-Api-Key header)
[functions.public-api]
verify_jwt = false

# MCP server pro Claude Desktop / Cursor / Cline / Smithery
[functions.mcp-server]
verify_jwt = false

# AI booking widget na motogo24.com (anonymous user chat)
[functions.ai-public-agent]
verify_jwt = false

# Stripe webhook receiver (auth = signed Stripe-Signature header)
[functions.webhook-receiver]
verify_jwt = false

# Reset hesla — anon-callable (zákazník zapomněl heslo, ještě není přihlášený).
# Anti-enumeration v kódu (vždy 200 success), takže anon přístup je OK.
[functions.send-recovery-otp]
verify_jwt = false
