# Supabase project configuration
# Pozn.: `project_id` musí matchovat tvůj cloud projekt (vnwnqteskbykeucanlhk).
# Per-function settings (`verify_jwt`, `import_map`, ...) se aplikují pouze
# pokud používáš `supabase functions deploy` s tímto repo jako workspace.

project_id = "vnwnqteskbykeucanlhk"

# ===== Edge funkce s vypnutou JWT verifikací =====
# Tyhle funkce volají anonymní klienti (web, AI agenti) a auth si řeší
# samy (token v body, X-Api-Key header, IP rate-limit, ...). Bez tohoto
# nastavení Supabase gateway zablokuje i OPTIONS preflight → CORS error.

# CMS save (volá motogo24.com admin overlay; auth = cms_admin_token v body)
[functions.cms-save]
verify_jwt = false

# Rozbalí zkrácený Mapy.com odkaz (mapy.com/s/…) a dekóduje body trasy pro Velín
# (import trasy). Vlastní ověření admina uvnitř (RPC is_admin z předaného JWT),
# proto verify_jwt=false (Velín posílá session token; ať CLI deploy nezmění stav).
[functions.resolve-mapy-route]
verify_jwt = false

# CMS admin auth — vymění raw cms_admin_token za podepsanou capability (#5 fix).
# Anon-callable (vlastní ověření tokenu uvnitř); podepisuje RSA privátním klíčem
# ze secretu CMS_ADMIN_SIGN_KEY. verify_jwt=false.
[functions.cms-admin-auth]
verify_jwt = false

# Stripe platební brána — volá web (dárkový poukaz, e-shop) anonymně přes apikey
# bez JWT. BEZ verify_jwt=false vrací gateway 401 ("nepodařilo se vytvořit platbu").
# (Auto-deploy CLI jinak defaultuje verify_jwt=true → regrese web plateb.)
[functions.process-payment]
verify_jwt = false

# Generuje faktury/doklady — volá Velín (admin JWT) i triggery/webhook (service key).
# verify_jwt=false ať CLI deploy nezmění dokumentovaný stav (OFF).
[functions.generate-invoice]
verify_jwt = false

# Odesílá branded maily — volají triggery/webhook (service key) i Velín. OFF.
[functions.send-booking-email]
verify_jwt = false

# OCR skener dokladů (OP/ŘP/pas) — volá web rezervace ANONYMNĚ (krok 2, nepřihlášený
# zákazník) jen s apikey. BEZ verify_jwt=false → 401 a nejde naskenovat doklad.
[functions.scan-document]
verify_jwt = false

# Uložení fotky verifikačního dokladu — taktéž anonymní web volání z rezervace. OFF.
[functions.save-verification-document]
verify_jwt = false

# Předávací protokol na samoobslužné pobočce — volá zákazník z appky (vlastní JWT)
# i cron auto-fill (service_role). Vlastní ověření přes authClassify → verify_jwt=false.
[functions.submit-handover-protocol]
verify_jwt = false

# SEO Health checker — server-side fetch & parse zive stranky motogo24.cz
# (browser-side fetch z velin domeny blokuje CORS). Volá ho Velin SEO Health
# dashboard. Read-only, jen GET na motogo24.cz whitelist domeny.
[functions.seo-check]
verify_jwt = false

# Veřejné REST API pro AI agenty / partnery (auth = X-Api-Key header)
[functions.public-api]
verify_jwt = false

# MCP server pro Claude Desktop / Cursor / Cline / Smithery
[functions.mcp-server]
verify_jwt = false

# AI booking widget na motogo24.com (anonymous user chat)
[functions.ai-public-agent]
verify_jwt = false

# Stripe webhook receiver (auth = signed Stripe-Signature header)
[functions.webhook-receiver]
verify_jwt = false

# Reset hesla — anon-callable (zákazník zapomněl heslo, ještě není přihlášený).
# Anti-enumeration v kódu (vždy 200 success), takže anon přístup je OK.
[functions.send-recovery-otp]
verify_jwt = false

# ===== Zbývající funkce — explicitně, ať auto-deploy nikdy nezmění stav =====
# Volané z Velína (admin JWT), appky (auth JWT), triggerů/webhooku (service key)
# nebo edge↔edge (service key) — auth si řeší interně (is_admin / service role).
# Drženo na verify_jwt=false (historický funkční stav dle STATE_5), aby se nic
# nerozbilo; všechny tyhle funkce dělají vlastní kontrolu oprávnění uvnitř.
[functions.admin-auth]
verify_jwt = false
[functions.admin-reset-password]
verify_jwt = false
[functions.ai-copilot]
verify_jwt = false
[functions.ai-customer-messages-suggest]
verify_jwt = false
[functions.ai-moto-agent]
verify_jwt = false
[functions.auto-check-service-parts]
verify_jwt = false
[functions.datova-schranka]
verify_jwt = false
[functions.flexi-sync]
verify_jwt = false
[functions.generate-document]
verify_jwt = false
[functions.manage-payment-methods]
verify_jwt = false
[functions.process-refund]
verify_jwt = false
[functions.receive-invoice]
verify_jwt = false
[functions.send-broadcast]
verify_jwt = false
[functions.send-cancellation-email]
verify_jwt = false
[functions.send-email]
verify_jwt = false
[functions.send-invoice-email]
verify_jwt = false
[functions.send-message]
verify_jwt = false
[functions.send-order-email]
verify_jwt = false
[functions.send-push]
verify_jwt = false

# Překlady přes Anthropic — volá je Velín (user JWT) i cms-save (service key).
# POZOR: projekt používá NOVÝ formát klíčů (sb_secret_/sb_publishable_), které
# NEJSOU JWT → verify_jwt=true by je odmítlo s UNAUTHORIZED_INVALID_JWT_FORMAT
# (zejm. edge→edge volání z cms-save). Proto verify_jwt=false jako u všech ostatních.
[functions.translate-content]
verify_jwt = false
[functions.translate-document]
verify_jwt = false
[functions.translate-pages-master]
verify_jwt = false
