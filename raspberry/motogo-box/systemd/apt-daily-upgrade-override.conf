# MotoGo Box — drop-in pro apt-daily-upgrade.timer (spouští unattended-upgrades): záplaty OS se
# instalují v noci ve 04:00 (+ náhodně až 20 min), kdy v boxu nikdo není. Výchozí Debian je 6:00
# ± 60 min, tj. i v provozní době. Restart OS se z tohoto timeru NIKDY nedělá (Automatic-Reboot false
# v 52motogo-unattended) — jen z Velína. Stažení seznamů balíků (apt-daily.timer) zůstává výchozí.
# Persistent=false přebíjí výchozí Persistent=true: zmeškaná noc (box byl bez proudu) se NEdohání hned po
# startu v provozní době (záplaty restartují NetworkManager/ModemManager a drží zámek apt), zkusí se až další noc.
# Instaluje install.sh / motogo-update do /etc/systemd/system/apt-daily-upgrade.timer.d/motogo.conf.
[Timer]
OnCalendar=
OnCalendar=*-*-* 04:00
RandomizedDelaySec=20m
Persistent=false
