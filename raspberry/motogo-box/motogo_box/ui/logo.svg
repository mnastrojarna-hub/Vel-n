<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="MotoGo24">
  <!-- MotoGo24 — jednoduché vektorové logo: zelená #74FB71 na tmavém pozadí -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#0f1a14"/>
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="#74FB71" stroke-opacity="0.35" stroke-width="2"/>
  <!-- kola motorky -->
  <circle cx="34" cy="86" r="17" fill="none" stroke="#74FB71" stroke-width="6"/>
  <circle cx="94" cy="86" r="17" fill="none" stroke="#74FB71" stroke-width="6"/>
  <circle cx="34" cy="86" r="4" fill="#74FB71"/>
  <circle cx="94" cy="86" r="4" fill="#74FB71"/>
  <!-- rám + řídítka -->
  <path d="M34 86 L52 58 L76 58 L94 86 M52 58 L46 44 L60 44 M76 58 L64 86 M64 86 L34 86" fill="none" stroke="#74FB71" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rychlostní čáry -->
  <path d="M8 60 H24 M4 70 H20" stroke="#74FB71" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- text 24 -->
  <text x="64" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#74FB71">MotoGo24</text>
