# MotoGo Box — SIMULÁTOR: stejná mapa jako brno-9zone.yaml (8 zón + venek), ale všechna zařízení
# běží lokálně (`python -m motogo_box simulate`, kontrakt §20). Pro vývoj a testy.
# Stejný tvar má `branch_kiosk_config.hardware` (vše kromě `zones`) a `branch_doors.hw`
# (jedna položka `zones`). Konfigurace z Velína má přednost před tímto souborem.
version: 1

network:
  subnet: 127.0.0.0/8                # simulátor běží na localhostu
  raspberry_ip: 127.0.0.1
  switch_ip: null
  default_gateway_on_eth0: null
  internet_interface: default

devices:
  wav645:  { type: wav645,       host: 127.0.0.1, port: 15020, unit_id: 1 }   # 16 relé: R1–R8 zámky zón 1–8, R9 a R12–R16 rezerva, R10 audio zóny 8, R11 rezerva (dřív audio zóny 9)
  wav617a: { type: wav617,       host: 127.0.0.1, port: 15021, unit_id: 1 }   # DI1–8 kontakty zón 1–8, R1–R8 bílé světlo zón 1–8
  wav617b: { type: wav617,       host: 127.0.0.1, port: 15022, unit_id: 1 }   # DI1 rezerva (dřív kontakt zóny 9), R1 venkovní osvětlení (outdoor), R2–R8 audio zón 1–7
  shelly1: { type: shelly_rgbww, host: 127.0.0.1, port: 18031 }
  shelly2: { type: shelly_rgbww, host: 127.0.0.1, port: 18032 }
  shelly3: { type: shelly_rgbww, host: 127.0.0.1, port: 18033 }
  shelly4: { type: shelly_rgbww, host: 127.0.0.1, port: 18034 }                # light 0 = zelená zóny 8, light 1–4 rezerva
  # řídicí API simulátoru: http://127.0.0.1:18099/sim/state (není zařízení, jen pro vývoj)

timings:
  lock_pulse_ms: 800
  door_open_timeout_s: 30
  door_close_debounce_ms: 1000
  light_after_close_s: 30
  music_after_close_s: 10
  maximum_session_s: 600
  forced_open_debounce_ms: 500
  pin_entry_timeout_s: 20
  overtime_alert_minutes: [10, 20, 30]

polling:
  door_input_poll_ms: 100
  software_debounce_ms: 300
  modbus_timeout_ms: 500
  retry_delays_ms: [100, 250, 500]
  device_offline_after_failures: 3

contacts:
  # Hodnota vstupu WAV617 při ZAVŘENÝCH dveřích (NC kontakt). §13.5: ověřit fyzicky
  # po zapojení; přerušený kabel se musí vyhodnotit jako otevřeno/porucha.
  closed_level: 1

security:
  maximum_failed_attempts: 5
  attempt_window_minutes: 5
  lockout_minutes: 15
  service_token_minutes: 10      # kód na displeji je viditelný (rozhodnutí 2026-09-11) — bez pin_length/mask_pin_on_screen

audio:
  volume: 70
  fade_in_ms: 1500
  fade_out_ms: 500
  selector_settle_ms: 200
  selector_on_ms: 100
  device: null            # např. "alsa/plughw:CARD=Device" (AXAGON USB); null = výchozí
  shuffle: true
  mode: selector          # selector = 1 mono zesilovač + relé (hraje vždy jen jedna zóna, venek nelze)
                          # multi    = každá místnost má VLASTNÍ zvukový výstup (ALSA) + vlastní mpv:
                          #            hudba hraje současně v libovolném počtu kójí, každá svůj playlist
                          #            (Velín → Hudba pobočky), venek hraje při jakémkoli kódu
                          #            (výstup venku = `outdoor.audio.out`, viz sekce outdoor níže).
  # Příklad režimu multi pro Brno (7 kójí + šatna + venek = 9 kanálů, 9× USB zvukovka pojmenovaná
  # udev pravidlem, viz HARDWARE.md; názvy karet dle `aplay -L`). Nastavuje se ve Velíně (HW mapa),
  # zde jen jako vzor — odkomentovat a `mode: multi`:
  # outputs:
  #   out1: { device: "alsa/plughw:CARD=Box1" }     # kóje 1
  #   out2: { device: "alsa/plughw:CARD=Box2" }     # kóje 2
  #   out3: { device: "alsa/plughw:CARD=Box3" }     # kóje 3
  #   out4: { device: "alsa/plughw:CARD=Box4" }     # kóje 4
  #   out5: { device: "alsa/plughw:CARD=Box5" }     # kóje 5
  #   out6: { device: "alsa/plughw:CARD=Box6" }     # kóje 6
  #   out7: { device: "alsa/plughw:CARD=Box7" }     # kóje 7
  #   out8: { device: "alsa/plughw:CARD=Satna" }    # šatna
  #   out9: { device: "alsa/plughw:CARD=Venek" }    # venek (kanál bez dveří) → `outdoor.audio: { out: out9 }`
  # channels.outdoor {out, trigger: any, dev?, coil?} = LEGACY alias `outdoor.audio` (stále podporovaný, ale
  #   výstup venku se nastavuje v sekci `outdoor` níže; při rozdílu platí outdoor.audio).
  # zones[].audio v režimu multi: { out: out1 } nebo { out: out1, dev: wav617b, coil: 1 } (výstup + enable relé zesilovače)

signal:
  brightness: 100
  blink_ms: 500
  pulse_ms: 1500
  transition_s: 0.2

# Modbus adresy začínají 0 (coil 0 = fyzické relé R1, input 0 = DI1). Shelly light id 0–4.
zones:
  - { zone: 1, lock: { dev: wav645, coil: 0 }, contact: { dev: wav617a, input: 0 }, light: { dev: wav617a, coil: 0 }, audio: { dev: wav617b, coil: 1 },  red: { dev: shelly1, light: 0 }, green: { dev: shelly1, light: 1 } }
  - { zone: 2, lock: { dev: wav645, coil: 1 }, contact: { dev: wav617a, input: 1 }, light: { dev: wav617a, coil: 1 }, audio: { dev: wav617b, coil: 2 },  red: { dev: shelly1, light: 2 }, green: { dev: shelly1, light: 3 } }
  - { zone: 3, lock: { dev: wav645, coil: 2 }, contact: { dev: wav617a, input: 2 }, light: { dev: wav617a, coil: 2 }, audio: { dev: wav617b, coil: 3 },  red: { dev: shelly1, light: 4 }, green: { dev: shelly2, light: 0 } }
  - { zone: 4, lock: { dev: wav645, coil: 3 }, contact: { dev: wav617a, input: 3 }, light: { dev: wav617a, coil: 3 }, audio: { dev: wav617b, coil: 4 },  red: { dev: shelly2, light: 1 }, green: { dev: shelly2, light: 2 } }
  - { zone: 5, lock: { dev: wav645, coil: 4 }, contact: { dev: wav617a, input: 4 }, light: { dev: wav617a, coil: 4 }, audio: { dev: wav617b, coil: 5 },  red: { dev: shelly2, light: 3 }, green: { dev: shelly2, light: 4 } }
  - { zone: 6, lock: { dev: wav645, coil: 5 }, contact: { dev: wav617a, input: 5 }, light: { dev: wav617a, coil: 5 }, audio: { dev: wav617b, coil: 6 },  red: { dev: shelly3, light: 0 }, green: { dev: shelly3, light: 1 } }
  - { zone: 7, lock: { dev: wav645, coil: 6 }, contact: { dev: wav617a, input: 6 }, light: { dev: wav617a, coil: 6 }, audio: { dev: wav617b, coil: 7 },  red: { dev: shelly3, light: 2 }, green: { dev: shelly3, light: 3 } }
  - { zone: 8, lock: { dev: wav645, coil: 7 }, contact: { dev: wav617a, input: 7 }, light: { dev: wav617a, coil: 7 }, audio: { dev: wav645,  coil: 9 },  red: { dev: shelly3, light: 4 }, green: { dev: shelly4, light: 0 } }
# rezerva: shelly4 light 1–4; wav645 coil 8 (R9), coil 10–15 (R11–R16); wav617b input 0 (DI1)

# Zóna 9 = venek (bez dveří): prostor před displejem + venkovní osvětlení (rozhodnutí 2026-09-11).
# Není řádek branch_doors — bez zámku, kontaktu, signalizace a dlaždice na displeji. Světlo svítí od
# zadání kódu (první relace) do `light_after_close_s` po poslední relaci; hudba venku hraje při jakémkoli
# kódu (jen audio.mode multi). Ve Velíně: Pobočky → Samoobsluha → hardware → blok Venek.
outdoor:
  zone: 9                             # popisné číslo pro Velín/diagnostiku/příkazy; NESMÍ kolidovat s číslem zóny dveří
  light: { dev: wav617b, coil: 0 }    # venkovní osvětlení = relé Waveshare (WAV617-B R1)
  # audio: { out: out9 }              # jen multi: výstup venku (+ volitelně dev/coil = enable relé zesilovače); selector: nelze
  light_after_close_s: null           # doběh venkovního světla; null/chybí = timings.light_after_close_s
