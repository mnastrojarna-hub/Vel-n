<!-- ===== MotoGo24 app v2.1 · shared/levelup.html — FAITHFUL storyboard replica of TODAY's level-up celebration
     (features/loyalty/loyalty_levelup_overlay.dart 2026-10-15). Owner: "pozor lvl up video neměň" → nothing here redesigns it.
     Needs rank-theme.css + levelup-classic.js (levelUpVals). Paste PART 1 into the board's single helmet style block (rules only, without the
     style tags), PART 2 as the last child of the board root (after toasts). Root: onClick = lu.tap (= the app's global Listener, trigger 1).
     Call: const LU = levelUpVals({ P, S, set, reduced: rm, blocked, bike: 'Husqvarna 701 SM', brand: 'Husqvarna', boardH: H, lang });
           const rk = rankTheme(LU.level, undefined, lang); prices: rankTheme(LU.priceLevel).pct; return { lu: LU, … }
           blocked = only what blocks TODAY (onboarding overlays, the payment screen; a board may add "offline" because the status cannot load).
     While lu.show the board adds class "paused" to its page wrapper (or root) → page loops stop (rank-theme.css .paused rule).
     Never: tier title card, ring stepping, reason line, gear line, "Zvuk oslav" toggle, "Přeskočit"/"Hotovo", separate "Tvůj stroj" step.
     The withdrawn v2 redesign (shared/levelup.* before 2026-10-16) is replaced by this file; shared/levelup.* are now copies of it. -->

<!-- PART 1 · CSS -->
<style>
/* ===== level-up · FAITHFUL replica of TODAY's celebration (features/loyalty/loyalty_levelup_overlay.dart, 2026-10-15; owner: "pozor lvl up video neměň").
   = shared/levelup-classic.html PART 1, pasted VERBATIM and identical in every board (DESIGN_V21 §6.7); the withdrawn v2 shared/levelup.* never comes back.
   Timings = the app's _seg() windows on its 67 s master clock (reveal rs = 1.4 s); the board plays 0–5 s and holds K6 (the app keeps the
   montage running to 67 s, last 5 s = photo, then closes itself). Base styles = END state (K6), animations carry the start → reduced motion
   (.rm) simply shows K6. Sizes 10 / 12 / 16 / 30 px are the shipped overlay's own: an explicit exception to the v2.1 type scale. */
@property --lucg{syntax:'<length>';inherits:false;initial-value:30px}
.luc{position:absolute;left:0;width:390px;height:844px;z-index:60;overflow:hidden;color:#fff;font-family:Montserrat,sans-serif;text-align:center;background:radial-gradient(110% 110% at 50% 30%,#16241B,#070E09);animation:lucIn .25s ease both}
.luc-ph{position:absolute;inset:0;overflow:hidden}
.luc-ph img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.14);animation:lucKb 9s linear both}
.luc-scr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,.1) 30%,rgba(0,0,0,.3) 55%,rgba(0,0,0,.88) 100%)}
.luc-beam{position:absolute;top:-80px;bottom:-80px;left:0;width:195px;background:linear-gradient(90deg,rgba(255,233,170,0),rgba(255,233,170,.16),rgba(255,233,170,0));transform:translateX(546px) rotate(6.9deg);animation:lucBeam 2.4s cubic-bezier(.65,0,.35,1) .2s both}
.luc-sl i{position:absolute;left:0;width:90px;height:2px;background:linear-gradient(90deg,rgba(255,233,170,0),rgba(255,233,170,.5),rgba(255,233,170,0));opacity:0;transform:translateX(468px);animation:lucSl 1.7s cubic-bezier(.65,0,.35,1) both}
.luc-sl i:nth-child(1){top:354px;animation-delay:.2s}.luc-sl i:nth-child(2){top:365px;animation-delay:.29s}.luc-sl i:nth-child(3){top:376px;animation-delay:.37s}
.luc-sl i:nth-child(4){top:387px;animation-delay:.46s}.luc-sl i:nth-child(5){top:398px;animation-delay:.54s}.luc-sl i:nth-child(6){top:409px;animation-delay:.63s}
.luc-sh{position:absolute;left:195px;top:354px;width:702px;height:702px;border-radius:50%;border:0 solid rgba(255,215,0,.5);opacity:0;transform:translate(-50%,-50%);animation:lucSh 3s cubic-bezier(.33,1,.68,1) 1.4s both}
.luc-bu{position:absolute;left:195px;top:354px;width:0;height:0}

.luc-spot{position:absolute;left:45px;top:239px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.5),rgba(0,0,0,0) 70%);animation:lucSpot 2s ease-out .4s both}
.luc-em{position:absolute;left:0;right:0;top:317px;display:flex;flex-direction:column;align-items:center;animation:lucO .72s ease-out .18s both,lucEl 2s linear .4s both}
.luc-ri{position:relative}
.luc-rg{display:block;padding:4px;border-radius:26px;color:var(--n);background:currentColor;--lucg:30px;box-shadow:0 0 var(--lucg) 3px color-mix(in srgb,currentColor 65%,transparent),0 0 calc(var(--lucg) * 2.6) 10px color-mix(in srgb,currentColor 30%,transparent);animation:lucRing 3s ease-out 1.4s both,lucPulse 1.1s linear .4s infinite alternate}

.luc-plus{position:absolute;top:-12px;right:-16px;padding:6px 11px;border-radius:999px;border:2px solid #fff;background:linear-gradient(90deg,var(--n),var(--n2));color:var(--on);font:900 17px/1 Montserrat,sans-serif;box-shadow:0 0 14px color-mix(in srgb,var(--n) 60%,transparent);animation:lucBadge 1.7s linear 2.3s both}
.luc.lg .luc-plus{background:linear-gradient(135deg,#FFD700,#FF6B00);color:#241A06;box-shadow:0 0 14px rgba(255,140,0,.6)}
.luc-k{margin-top:10px;font:900 11px/1.2 Montserrat,sans-serif;letter-spacing:5px;color:rgba(255,255,255,.9)}
.luc.tb .luc-k{font-size:13px}
.luc.lg .luc-k{color:rgba(255,231,160,.9)}
.luc-fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:lucFl 2.4s ease-out 1.4s both}

.luc-bt{position:absolute;left:26px;right:26px;bottom:68px;display:flex;flex-direction:column;align-items:center;animation:lucUp 2.1s ease-out 1.7s both}
.luc-nm{font:900 30px/1.05 Montserrat,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--n);text-shadow:0 0 18px color-mix(in srgb,var(--n) 90%,transparent),0 0 36px color-mix(in srgb,var(--n) 50%,transparent)}
.luc.lg .luc-nm{color:transparent;background:linear-gradient(90deg,#FFF4D6,#E9B24B,#FFD27A);-webkit-background-clip:text;background-clip:text;text-shadow:none;filter:drop-shadow(0 0 14px rgba(255,140,0,.6))}

.luc-go:focus-visible{outline:3px solid #fff;outline-offset:3px}
.luc-ann{position:absolute;left:16px;right:16px;top:12px;padding:8px 12px;border-radius:12px;border:1.5px dashed #FFD36B;background:rgba(10,31,20,.82);color:#FFD36B;font:800 11px/1.35 Montserrat,sans-serif;letter-spacing:.02em}

@keyframes lucBadge{0%{transform:scale(0.000)}4.2%{transform:scale(0.406)}8.3%{transform:scale(0.855)}12.5%{transform:scale(1.161)}16.7%{transform:scale(1.273)}20.8%{transform:scale(1.234)}25%{transform:scale(1.125)}29.2%{transform:scale(1.017)}33.3%{transform:scale(0.950)}37.5%{transform:scale(0.931)}41.7%{transform:scale(0.946)}45.8%{transform:scale(0.975)}50%{transform:scale(1.000)}54.2%{transform:scale(1.014)}58.3%{transform:scale(1.017)}62.5%{transform:scale(1.012)}66.7%{transform:scale(1.005)}70.8%{transform:scale(0.999)}75%{transform:scale(0.996)}79.2%{transform:scale(0.996)}83.3%{transform:scale(0.997)}87.5%{transform:scale(0.999)}91.7%{transform:scale(1.000)}95.8%{transform:scale(1.001)}100%{transform:scale(1.000)}}
.luc.tb .luc-rg{--lucg:36px;animation-name:lucRing,lucPulseT}

.rm .luc *,.luc.rm,.luc.rm *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.luc,.luc *{animation:none!important}}
</style>
