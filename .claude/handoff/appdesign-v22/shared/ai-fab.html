<!-- ===== MotoGo24 app v2 · shared/ai-fab.html — global AI assistant button (bottom-right, every shell screen) + expand-into-chat panel.
     Needs rank-theme.css + ai-fab.js (aiFabVals). Paste PART 1 into the board's single helmet style block (rules only, without the style tags); PART 2 right AFTER the nav
     (or after the sticky bar on boards without nav), before toasts. Holes: `ai: aiFabVals({...})`. Localized (board prop "jazyk", 8 langs): FAB label, coach bubble, chat
     header, every control name, greeting, chips, SOS chip and the app keys (v2.1, 2026-10-16). Mirrors ai_agent_screen.dart: photo button
     → sheet (Vyfotit budíky / Vybrat z galerie), ≤ 3 thumbnails with ✕ + counter, SOS card when sosAllowed, error bubble + retry, thinking dots.
     Tap targets ≥ 44 (coach ✕, close, chips, camera, thumbnail ✕ via ::after); focus = two-tone ring on the FAB (dark 2 + neon 6).
     Placement (bottom = lowest obstruction + 12): tabs → 110 (nav 98) · + status strip → 170 · Detail sticky (136) → mini 44 @ 148 ·
     Booking summary → mini 44 @ summary + 12 · hidden on payment/success/chat/keyboard/scanner/route-nav/login/sheets.
     Look: dark glass disc, rank RING (material) + soft rank glow, chat-spark glyph, NO text, NO idle loop — never brighter than the CTA. -->

<!-- PART 1 · CSS -->
<style>
.rk .ai-fab{position:absolute;right:16px;z-index:31;width:56px;height:56px;padding:2px;border-radius:50%;border:0;cursor:pointer;background:var(--rk-ring);box-shadow:0 0 0 1px var(--rk-ring2),0 0 18px -2px var(--rk-glow-a),0 8px 18px rgba(0,0,0,.35);transition:bottom .3s ease,transform .3s cubic-bezier(.3,1.3,.5,1),opacity .2s ease,width .3s ease,height .3s ease;-webkit-tap-highlight-color:transparent}
.ai-fab>b{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;color:#74FB71;background:radial-gradient(circle at 30% 25%,#24563B,#0E2A1C 55%,#0A1F14)}
.ai-fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:width .3s,height .3s}
.ai-fab svg .sp{fill:currentColor;stroke:none}
.rk .ai-fab:active{transform:scale(.92)}
.rk .ai-fab:focus-visible{outline:2px solid #0A1F14;outline-offset:2px;box-shadow:0 0 0 6px #74FB71}
.rk .ai-fab.mini{width:44px;height:44px;box-shadow:0 0 0 1px var(--rk-ring2),0 6px 14px rgba(0,0,0,.35)}
.ai-fab.mini svg{width:21px;height:21px}
.rk .ai-fab.peek{transform:translateX(26px);opacity:.85}
.rk .ai-fab.off{transform:scale(.8);opacity:0;pointer-events:none}
.rk .ai-fab.in{animation:aiIn .45s cubic-bezier(.2,1.4,.4,1) .6s both}
.ai-coach{position:absolute;right:82px;z-index:31;display:flex;align-items:center;gap:6px;max-width:250px;padding:8px 8px 8px 16px;border-radius:16px 16px 6px 16px;background:#0E2A1C;border:1px solid rgba(116,251,113,.35);color:#E8F5EE;font:700 12.5px/1.35 Montserrat,sans-serif;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);animation:aiCoach .5s cubic-bezier(.2,1.2,.4,1) 1.2s both}
.rk .ai-coach button{flex:none;width:44px;height:44px;margin:-6px -4px -6px 0;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#CFE7DA;font:800 17px/1 Montserrat,sans-serif;cursor:pointer}
.ai-ct{display:flex;flex-direction:column;gap:2px}
.ai-ct b{font:800 11px/14px Montserrat,sans-serif;letter-spacing:.04em;color:#A8FF9F;text-transform:uppercase}
.rk .ai-scrim{position:absolute;inset:0;z-index:44;background:rgba(10,31,20,.55);border:0;animation:aiFade .25s ease both}
.ai-chat{position:absolute;right:12px;z-index:45;width:366px;max-height:560px;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;color:#E8F5EE;font-family:Montserrat,sans-serif;background:radial-gradient(150% 110% at 100% 0,var(--rk-aura) 0,#0E2A1C 55%,#0A1F14 100%);border:1px solid rgba(116,251,113,.28);box-shadow:0 24px 60px -12px rgba(0,0,0,.6);transform-origin:100% 100%;animation:aiOpen .35s cubic-bezier(.2,0,0,1) both}
.ai-hd{display:flex;align-items:center;gap:10px;padding:16px 12px 12px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.ai-hd b{display:block;font:800 15px/1.2 Montserrat,sans-serif;color:#fff}
.ai-hd small{display:block;font:600 11.5px/1.3 Montserrat,sans-serif;color:#A8FF9F}
.rk .ai-x{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#fff;font:800 20px/1 Montserrat,sans-serif;cursor:pointer}
/* §6.1: the shared AI chat close and the coach close draw the ✕ icon (never a "×" glyph) */
.rk .ai-x svg,.rk .ai-coach button svg{display:block;width:20px;height:20px;margin:auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.rk .ai-coach button svg{width:18px;height:18px}
.ai-body{display:flex;flex-direction:column;gap:10px;padding:16px 16px 8px;overflow:auto}
.ai-m{max-width:86%;padding:10px 12px;border-radius:16px;font:600 13.5px/1.45 Montserrat,sans-serif;animation:aiMsg .3s ease both}
.ai-m.bot{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(116,251,113,.18);border-bottom-left-radius:6px}
.ai-m.me{align-self:flex-end;background:linear-gradient(135deg,#8DFF86,#37CF63);color:#08230F;border-bottom-right-radius:6px}
.ai-m.note{align-self:center;max-width:100%;padding:4px 10px;background:none;border:0;color:#9FC4B1;font:600 11.5px/1.35 Montserrat,sans-serif;text-align:center}
.ai-typ{align-self:flex-start;display:flex;align-items:center;gap:4px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.07)}
.ai-typ span{margin-left:6px;font:700 12.5px/1 Montserrat,sans-serif;color:#9FC4B1}
.ai-typ i{width:7px;height:7px;border-radius:50%;background:#A8FF9F;animation:aiDot 1s ease-in-out infinite}
.ai-typ i:nth-child(2){animation-delay:.15s}.ai-typ i:nth-child(3){animation-delay:.3s}
.ai-chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 12px}
.rk .ai-chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(116,251,113,.4);background:rgba(116,251,113,.08);color:#E8F5EE;font:700 12.5px/1.2 Montserrat,sans-serif;cursor:pointer;animation:aiMsg .3s ease both}
.rk .ai-chip.sos{background:#D92D20;border-color:#D92D20;color:#fff;font-weight:800}
.ai-in{display:flex;gap:8px;padding:12px 12px 16px;border-top:1px solid rgba(255,255,255,.08)}
.ai-in input{flex:1;min-width:0;height:46px;padding:0 12px;border-radius:14px;border:1.5px solid rgba(116,251,113,.3);background:rgba(255,255,255,.06);color:#fff;font:600 14px Montserrat,sans-serif;outline:none}
.ai-in input:focus{border-color:#74FB71;box-shadow:0 0 0 4px rgba(116,251,113,.18)}
.rk .ai-send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,#8DFF86,#37CF63);color:#08230F;cursor:pointer}
.ai-send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* v2.1 · error bubble + retry, SOS card (app _buildBubble isSosHint: redBg, #FCA5A5 border, #B91C1C / #991B1B), photo attach */
.ai-m.err{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:92%;border-color:rgba(255,179,179,.45);background:rgba(217,45,32,.16)}
.ai-m.err>svg{flex:none;width:20px;height:20px;fill:none;stroke:#FFB3B3;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ai-m.err>span{flex:1 1 170px;min-width:0}
.rk .ai-rt{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;font:800 12.5px/1.2 Montserrat,sans-serif;cursor:pointer}
.rk .ai-sos{align-self:stretch;display:flex;align-items:center;gap:12px;min-height:56px;padding:12px;border-radius:14px;border:1px solid #FCA5A5;background:#FEF2F2;color:#B91C1C;text-align:left;cursor:pointer;animation:aiMsg .3s ease both}
.rk .ai-sos:active{transform:scale(.98)}
.ai-sos-i{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#D92D20;color:#fff}
.ai-sos svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ai-sos-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ai-sos-t b{font:800 14px/1.25 Montserrat,sans-serif;color:#B91C1C}
.ai-sos-t small{font:600 12.5px/1.35 Montserrat,sans-serif;color:#991B1B}
.ai-mph{display:flex;gap:4px;margin-bottom:6px}
.ai-mph i{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(8,35,15,.16);color:#08230F;font:800 11px/1 Montserrat,sans-serif;font-style:normal}
.ai-att{display:flex;align-items:center;gap:12px;padding:12px 16px 0}
.ai-th{position:relative;flex:none;width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,#24563B,#0E2A1C);border:1px solid rgba(116,251,113,.3);color:#A8FF9F;animation:aiMsg .3s ease both}
.ai-th>svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ai-th b{position:absolute;left:6px;bottom:4px;font:800 11px/1 Montserrat,sans-serif;color:#E8F5EE}
.rk .ai-thx{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;border:2px solid #0E2A1C;background:#1A2E22;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rk .ai-thx::after{content:'';position:absolute;inset:-8px}
.ai-thx svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.ai-cnt{margin-left:auto;font:800 11.5px/1 Montserrat,sans-serif;color:#9FC4B1}
.ai-src{display:flex;flex-direction:column;gap:4px;margin:0 12px;padding:8px;border-radius:16px;background:#0A1F14;border:1px solid rgba(116,251,113,.28);animation:aiMsg .3s ease both}
.rk .ai-so{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:12px;border:0;background:none;color:#E8F5EE;font:700 14px/1.2 Montserrat,sans-serif;text-align:left;cursor:pointer}
.rk .ai-so:active{background:rgba(255,255,255,.08)}
.ai-so svg{flex:none;width:20px;height:20px;fill:none;stroke:#A8FF9F;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rk .ai-so.x{justify-content:center;color:#9FC4B1;font-weight:800}
.rk .ai-cam{position:relative;flex:none;width:44px;height:46px;border-radius:14px;border:1.5px solid rgba(116,251,113,.3);background:rgba(255,255,255,.06);color:#9FC4B1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .18s,border-color .18s}
.rk .ai-cam.on{color:#74FB71;border-color:#74FB71}
.ai-cam svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ai-cam b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#74FB71;color:#08230F;font:800 11px/18px Montserrat,sans-serif;text-align:center}
@keyframes aiIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes aiCoach{from{opacity:0;transform:translateX(12px) scale(.94)}to{opacity:1;transform:none}}
@keyframes aiOpen{from{opacity:.3;transform:scale(.14);border-radius:40px}to{opacity:1;transform:none;border-radius:24px}}
@keyframes aiFade{from{opacity:0}to{opacity:1}}
@keyframes aiMsg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes aiDot{0%,100%{transform:none;opacity:.5}50%{transform:translateY(-3px);opacity:1}}
/* v2.2 focused screens (route navigation, planner, POI pick, submit / add place, ride recorder, ride detail, place / route maps, address map):
   AI = 44 px disc in the screen's top bar, right side (PART 3) — same ring + glyph as the FAB, no glow, no loop; hidden only under modal sheets / dialogs */
.rk .ai-tb{flex:none;position:relative;width:44px;height:44px;padding:2px;border:0;border-radius:50%;background:var(--rk-ring);box-shadow:0 0 0 1px var(--rk-ring2),0 4px 12px rgba(0,0,0,.25);cursor:pointer;transition:transform .15s ease}
.rk .ai-tb:active{transform:scale(.92)}
.ai-tb>b{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;color:#74FB71;background:radial-gradient(circle at 30% 25%,#24563B,#0E2A1C 55%,#0A1F14)}
.ai-tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rm .ai-fab,.rm .ai-fab svg,.rm .ai-coach,.rm .ai-scrim,.rm .ai-chat,.rm .ai-m,.rm .ai-chip,.rm .ai-typ i,.rm .ai-sos,.rm .ai-th,.rm .ai-src,.rm .ai-cam{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.ai-fab,.ai-fab svg,.ai-coach,.ai-scrim,.ai-chat,.ai-m,.ai-chip,.ai-typ i,.ai-sos,.ai-th,.ai-src,.ai-cam{animation:none!important;transition:none!important}}
</style>
