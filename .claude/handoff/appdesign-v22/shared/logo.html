<!-- ===== MotoGo24 app v2 · shared/logo.html — the REAL logo (assets/logo.webp = black tile, neon MG mark, "MOTO GO 24") + LogoRow.
     The logo is NEVER recoloured: rank = wide ring + glow + progress arc AROUND it (lib/core/widgets/logo_header.dart).
     Needs rank-theme.css (.rk-frame/.rk-arc/.rk-lv/.rk-crown/.rk-laurel). Holes: rk = rankTheme(level) + board-set rk.open (→ /loyalty demo)
     + logoSub = logoSubVal(lang) (localized subtitle, board prop "jazyk"; PART 0).
     PART 0 = JS (paste VERBATIM inside renderVals()), PART 1 = CSS (paste the rules, without the style tags, into the board's single helmet style block),
     PART 2 = LogoRow markup (header), PART 3 = bare tile (any other place: chat avatar, level-up). -->

<!-- PART 0 · JS — logoSubVal(lang) → LogoRow subtitle (shown uppercase 11/700 = the type-scale minimum, +1.2 px tracking). Montserrat Bold ≈
     cs 150 · en 153 · de 145 · es 146 · fr 150 · nl 118 · pl 207 · uk 158 px (10 px values × 1.1). A header that leaves < 210 px for the text lets it wrap
     instead of clipping (Main: .hd .lg-tx small{white-space:normal;max-width:160px}); the title "MOTO GO 24" never changes.
function logoSubVal(lang) {
  const M = { cs: 'Půjčovna motorek', en: 'Motorcycle rental', de: 'Motorrad-Verleih', es: 'Alquiler de motos', fr: 'Location de motos', nl: 'Motorverhuur', pl: 'Wypożyczalnia motocykli', uk: 'Прокат мотоциклів' };
  return M[String(lang || 'cs').slice(0, 2)] || M.cs;
}
-->

<!-- PART 1 · CSS -->
<style>
.lg-row{display:flex;align-items:center;gap:14px;min-width:0}
.rk .lg-btn{flex:none;display:inline-flex;padding:8px;margin:-8px;border-radius:24px;background:none;border:0;cursor:pointer;transition:transform .15s ease}
.rk .lg-btn:active{transform:scale(.92)}
.rk .lg-btn:focus-visible{outline:3px solid #74FB71;outline-offset:2px}
.lg-tile{display:block;width:52px;height:52px;border-radius:14px}
.lg-tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.lg-tx b{font:900 22px/1.05 Montserrat,sans-serif;letter-spacing:-.5px;color:#fff;white-space:nowrap}
.lg-tx small{font:700 11px/1.2 Montserrat,sans-serif;letter-spacing:1.2px;color:rgba(255,255,255,.62);white-space:nowrap;text-transform:uppercase}
</style>
