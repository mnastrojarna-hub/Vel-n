<!-- ===== MotoGo24 app v2.2 · shared/push-banner.html — foreground push banner (needs push-banner.js → pushVals → `pb`, rank-theme.css).
     PART 1 = rules for the board's style block (without the style tags) · PART 2 = markup, once inside the board root (positions itself with pb.st).
     Rank: a 2 px rank-ring rule on top + the action in the rank text-on-dark colour (--rk-acc, ≥ 4.5:1 on the night glass); door codes keep the
     MotoGo green frame + title (meaning, not rank). Layer 52 (above toasts 50, under the level-up). Action and ✕ are 44 px. Auto-hide 8 s / 5 s,
     paused while touched; the canvas keeps it visible. Reduced motion: no slide, the countdown rule is static. -->

<!-- PART 1 · CSS -->
<style>
.pb{position:absolute;left:12px;right:12px;z-index:52;display:flex;align-items:flex-start;gap:10px;padding:12px 4px 14px 12px;border-radius:16px;background:#0E2A1C;color:#fff;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);font-family:Montserrat,sans-serif;overflow:hidden;animation:pbIn .32s var(--ez) both}
.pb::before{content:'';position:absolute;left:16px;right:16px;top:0;height:2px;border-radius:0 0 2px 2px;background:var(--rk-ring)}
.pb.key{background:#1A2E22;box-shadow:inset 0 0 0 1.5px #74FB71,0 18px 40px -12px rgba(0,0,0,.6)}
.pb-i{flex:none;display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin-top:2px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff}
.pb.key .pb-i{background:rgba(116,251,113,.16);color:#74FB71}
.pb-i svg,.pb-x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pb-t{flex:1;min-width:0;padding-top:2px}
.pb-t b{display:block;font:800 14px/1.3 Montserrat,sans-serif;color:#fff}
.pb.key .pb-t b{font-weight:900;color:#74FB71}
.pb-t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;font:600 12.5px/1.45 Montserrat,sans-serif;color:rgba(255,255,255,.86)}
.pb.key .pb-t span{-webkit-line-clamp:4}
.pb-c{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.mg .pb-a{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 10px;border:0;border-radius:12px;background:none;color:var(--rk-acc);font:800 13.5px/1 Montserrat,sans-serif;cursor:pointer}
.mg .pb-x{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:50%;background:none;color:rgba(255,255,255,.8);cursor:pointer}
.pb-bar{position:absolute;left:12px;right:12px;bottom:5px;height:2px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.pb-bar i{display:block;height:100%;background:var(--rk-acc);transform-origin:left;animation:pbT var(--pb-d) linear both}
.rm .pb,.rm .pb-bar i{animation:none}
@keyframes pbIn{from{opacity:0;transform:translateY(-16px)}}
@keyframes pbT{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.pb,.pb-bar i{animation:none!important}}
</style>

<!-- PART 2 · markup -->
<sc-if value="{{ pb.show }}" hint-placeholder-val="{{ false }}">
<div class="{{ pb.cls }}" style="{{ pb.st }}" role="status" aria-live="{{ pb.live }}">
<span class="pb-i" aria-hidden="true"><sc-if value="{{ pb.key }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24"><path d="M14.5 3a6.5 6.5 0 0 0-6.2 8.5L3 16.8V21h4.2v-2.4h2.4v-2.4h2.4l1.3-1.3A6.5 6.5 0 1 0 14.5 3zM16.5 7.5h.01"></path></svg></sc-if><sc-if value="{{ pb.msg }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24"><path d="M3.5 6h17v12h-17zM3.5 6.5l8.5 7 8.5-7"></path></svg></sc-if></span>
<span class="pb-t"><b>{{ pb.t }}</b><span>{{ pb.b }}</span></span>
<span class="pb-c"><button class="pb-x" onClick="{{ pb.x }}" aria-label="{{ pb.xL }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button><button class="pb-a" onClick="{{ pb.a }}">{{ pb.l }}</button></span>
<span class="pb-bar" aria-hidden="true"><i></i></span>
</div>
</sc-if>
<!-- /PART 2 -->
