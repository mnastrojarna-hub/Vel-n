name: motogo_app
description: MotoGo24 — Motorcycle rental app (iOS / App Store release)
publish_to: 'none'
# version: <CFBundleShortVersionString>+<CFBundleVersion>
# 1.1.0 = uživatelsky viditelná verze (App Store), měň ji ručně pro skutečné releasy.
# +1    = JEN fallback pro lokální build. V CI (Codemagic) se PŘEPISUJE automaticky
#         přes --build-number=$BUILD_NUMBER, aby byl CFBundleVersion vždy unikátní
#         a rostoucí → App Store Connect nikdy neodmítne "build už existuje".
version: 2.0.7+9

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0

  # State management
  flutter_riverpod: ^2.4.9

  # Routing
  go_router: ^13.0.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Filesystem dirs + image cache manager (full cache purge on app update)
  path_provider: ^2.1.2
  flutter_cache_manager: ^3.3.1

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9

  # Video playback (MP4 videa motorky na detailu)
  video_player: ^2.9.1

  # i18n
  intl: ^0.20.2

  # Biometric auth
  local_auth: ^2.1.8

  # HTTP client
  http: ^1.2.0

  # Network / connectivity
  connectivity_plus: ^5.0.2

  # URL launcher (Stripe checkout)
  url_launcher: ^6.2.2

  # Stripe native Payment Sheet (in-app payments)
  flutter_stripe: ^11.3.0

  # WebView (invoices, contracts display in-app)
  webview_flutter: ^4.10.0

  # Image picker (document scanning, SOS photos)
  image_picker: ^1.0.5

  # Image processing (resize for OCR — matches Capacitor's _resizeForOCR)
  image: ^4.3.0

  # Camera (custom camera with document overlay)
  camera: ^0.11.0+2

  # Permissions (centralized request at startup)
  permission_handler: ^11.3.0

  # GPS
  geolocator: ^10.0.0

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Firebase messaging (push)
  firebase_messaging: ^14.7.6
  firebase_core: ^2.24.2

  # App version info (runtime access to pubspec version)
  package_info_plus: ^8.0.0

  # Google Play in-app updates (flexible/immediate update prompt)
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

# app_links 7.x přešlo na build.gradle.kts, které na zdejším AGP padá
# (DefaultAndroidSourceSet_Decorated cannot be cast to AndroidLibrarySourceSet).
# Bez commitnutého pubspec.lock se app_links rozjede na nejnovější (7.1.0).
# Připínáme poslední 6.x — má android `namespace` (nutné pro AGP 8) a ještě
# bez té rozbité kts změny. Runtime API (getInitialAppLink / uriLinkStream)
# je shodné, takže deep-linky fungují dál.
dependency_overrides:
  app_links: '>=6.3.0 <7.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/
