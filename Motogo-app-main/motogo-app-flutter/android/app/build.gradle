plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

android {
    namespace "com.motogo24.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.motogo24.app"
        // flutter.minSdkVersion = minimum podporované aktuálním Flutter SDK
        // (3.44 → API 24). Firebase BOM a flutter_secure_storage 10 vyžadují
        // min. 23 — pevná 21 by po upgradu pluginů rozbila manifest merge.
        minSdk flutter.minSdkVersion
        // Android 16 — od 31. 8. 2026 povinné pro updaty v Google Play.
        // Zároveň řeší Play warning „Zobrazení bez okrajů nemusí fungovat":
        // na SDK 36 je edge-to-edge vynucené (bez opt-outu) a appka ho už
        // podporuje (enableEdgeToEdge v MainActivity + průhledné lišty).
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (System.getenv("CM_KEYSTORE_PATH")) {
                storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig System.getenv("CM_KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:32.7.0")
    implementation "com.google.firebase:firebase-messaging"
    // Required for Stripe Payment Sheet (MaterialComponents theme)
    implementation "com.google.android.material:material:1.12.0"
    // Android 15+ edge-to-edge: poskytuje enableEdgeToEdge() v MainActivity.
    // 1.10.x na API 35+ už nevolá zastaralé Window.set*BarColor (Play warning
    // „zastaralá rozhraní API nebo parametry pro zobrazení bez okrajů").
    implementation "androidx.activity:activity-ktx:1.10.1"
}
