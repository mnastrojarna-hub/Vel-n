# packageRelease (IncrementalSplitterRunnable) padal v Codemagic release buildu
# po R8 full mode na nedostatek paměti se 2 GB heapem — mac_mini_m2 má 8 GB.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
# Google Play doporučení „Optimalizací R8 můžete zlepšit paměť a výkon":
# full mode = agresivnější shrink/optimalizace. U AGP 8+ je sice výchozí,
# ale držíme explicitně, aby ho případný upgrade/CI nevypnul.
android.enableR8.fullMode=true
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
